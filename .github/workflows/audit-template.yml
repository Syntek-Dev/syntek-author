name: Audit — Template Integrity

# Every audit and test in DESIGN.md Section 7, on every push to every branch.
#
# NO PATH FILTER AND NO BRANCH FILTER ON PUSH. A template-integrity defect is invisible until
# somebody generates, and whoever generates is not whoever broke it (syntek-base, 15–16/08/2026:
# seventeen commits ran blind and five shipped a template that could not generate at all). A
# gate that waits for a pull request lets a feature branch drift for as long as it lives.
#
# THREE JOBS, in parallel. [1/3] reads the template source and shellchecks every script; [2/3]
# renders every variant and profile once and audits the renders; [3/3] performs a real update,
# a real adoption and a second template beside the first, each in its own scratch project.
# Every script's --self-test runs before its real run: a detector nobody has seen fail is a
# detector nobody knows works. Failures ACCUMULATE as ::error:: lines and the job fails at the
# end, so one broken gate never hides the next (the shellcheck step runs even after a failed
# audit step: `if: always()`).
#
# NO JOB MATRIX AND NO CONCURRENCY GROUP. Both need GitHub's expression syntax, and this file
# must never contain the dollar-brace-brace sequence at all: GitHub parses it anywhere in a
# workflow file, even inside a run block. Render paths are a shell loop instead.
#
# NO DATA ROOT. SYNTEK_DATA_ROOT is never set here (DESIGN.md D50, Section 7): a fresh render
# keeps its binaries under a data root, and no test may reach a real one. Every audit unsets it
# when it sources _common.sh; the three Python self-tests run under `env -u SYNTEK_DATA_ROOT`, and
# the resolver's own self-test never reads the inherited variable. A case that needs a root
# makes a temporary one holding its own marker.
#
# ONE PYTHON, AND THE COPIER FLOOR. Every job runs Python 3.12: the resolver and the permissions
# script need 3.11 (tomllib), and Copier, the newest and the declared floor alike, needs 3.10.
# UV_PYTHON keeps every uvx Copier on that same interpreter. The renders use the newest Copier;
# job [2/3] renders four profiles again on copier.yml's _min_copier_version (DESIGN.md D2)
# and compares them byte for byte, as run-all.sh's check 4 does.
#
# Locally, one command does all three: bash .github/scripts/run-all.sh
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Copier commits inside its own scratch repositories during an update, and the runner has no
  # git identity; without one, every update test fails on "Please tell me who you are".
  # UV_PYTHON is uv's --python: every uvx Copier runs on the Python the jobs set up.
  UV_PYTHON: "3.12"
  GIT_AUTHOR_NAME: syntek-author audit
  GIT_AUTHOR_EMAIL: audit@example.com
  GIT_COMMITTER_NAME: syntek-author audit
  GIT_COMMITTER_EMAIL: audit@example.com

jobs:
  source:
    name: "[1/3] Template source"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Tokens, the generated mode-file block, pairs and routed shapes, the line cap, personal
      # data, development isolation, seeds, skills and the family-shared set (D48) — every one
      # reads template/ or the repository root, and none renders anything. dev-isolation's
      # Codex probe is skipped here, by name: the runner has no codex.
      - name: Prove each detector, then run it on the template source
        run: |
          status=0
          for s in check-template-tokens gen-mode-excludes docs-pairing line-cap scrub \
                   dev-isolation shipped-seeds skill-conformance family-shared; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            if [ "$s" = gen-mode-excludes ]; then
              bash ".github/scripts/$s.sh" --check || { echo "::error::$s — copier.yml's mode-file block has drifted from the files on disk"; status=1; }
            else
              bash ".github/scripts/$s.sh" || { echo "::error::$s — findings in the template source"; status=1; }
            fi
            echo "::endgroup::"
          done
          exit $status

      # The Python script whose classes, refresh and printed commands no audit renders a
      # project to judge alone (DESIGN.md D52): its own self-test builds scratch projects with
      # git and proves each class, the refresh, the settings additions and the MCP lane (D54).
      - name: Prove the update report script
        if: always()
        run: env -u SYNTEK_DATA_ROOT python3 migrations/family-update.py --self-test

      # The data-root resolver every project ships (DESIGN.md D50, D53): its self-test makes
      # its own temporary roots, each holding its own marker, and never reads the inherited
      # SYNTEK_DATA_ROOT (unset here as well). shipped-variants runs it again in every render.
      - name: Prove the data-root resolver
        if: always()
        run: env -u SYNTEK_DATA_ROOT python3 template/.claude/syntek-author-dataroot.py --self-test

      # The family-shared outside-link migration (DESIGN.md D48): its self-test runs both stages
      # in temporary folders and runs the printed hand fix with sh after each kind of stop.
      - name: Prove the outside-link migration
        if: always()
        run: env -u SYNTEK_DATA_ROOT python3 migrations/agents-outside-link.py --self-test

      # Every shell script this repository runs or ships: the migrations copier update runs in an
      # author's project, the adoption scripts, these audits, and the template's hooks. Warning
      # level and up fails; style and info notes do not. shellcheck-py pins the version (the
      # runner's own shellcheck moves with the image). -x follows each audit's
      # `source=SCRIPTDIR/_common.sh` directive, so a variable an audit sets for _common.sh
      # (QUIET, SA_SETS_FOR, the A_* answers) reads as used: no SC2034 is disabled anywhere.
      - name: Shellcheck every script
        if: always()
        run: |
          python -m pip install --quiet "shellcheck-py==0.11.0.1"
          shellcheck --version | head -2
          shellcheck -S warning -x migrations/*.sh adopt/*.sh .github/scripts/*.sh template/.claude/hooks/*.sh \
            || { echo "::error::shellcheck — warnings or errors in the scripts above"; exit 1; }

  renders:
    name: "[2/3] Renders"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Copier reads the template over git

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pandoc is a short apt install and proves `make docx` on every render. XeLaTeX is not
      # cheap (a TeX Live install), so `make pdf` runs locally; tooling-smoke.sh names every
      # target it skipped, and why, rather than reporting it as passed.
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Prove the renderer
        run: bash .github/scripts/generate-all.sh --self-test

      # Every DOC_TYPE × profile: defaults, all options on, all options off, adoption, the
      # fiction kit opened explicitly, and the other coding agents (Claude only, one render per
      # OpenCode provider, and Trap 2's hidden answers by --data and by a settings file). The
      # negative paths are the ones that rot silently. generate-all also proves the agent
      # validators with Copier's own Jinja (through uvx).
      - name: Render every variant and profile
        run: |
          status=0
          bash .github/scripts/generate-all.sh "$RUNNER_TEMP/renders" > "$RUNNER_TEMP/trees.txt" \
            || { echo "::error::generate-all — at least one render failed (its log is beside it)"; status=1; }
          echo "rendered:"; cat "$RUNNER_TEMP/trees.txt"
          [ -s "$RUNNER_TEMP/trees.txt" ] || { echo "::error::generate-all — nothing rendered at all"; exit 1; }
          exit $status

      # shipped-variants runs the permissions script's --check in every render (python 3.12
      # here); its opencode and codex probes are skipped, by name, as neither is installed.
      - name: Prove each detector, then run it on every render
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/trees.txt" ] || { echo "::error::no renders to audit"; exit 1; }
          mapfile -t trees < "$RUNNER_TEMP/trees.txt"
          status=0
          for s in shipped-variants byte-identity doc-references docs-pairing shipped-seeds \
                   skill-conformance tooling-smoke; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            case "$s" in
              tooling-smoke) extra="--require-pandoc" ;;
              *)             extra="" ;;
            esac
            # shellcheck disable=SC2086  # an empty $extra must vanish, not become ""
            bash ".github/scripts/$s.sh" $extra "${trees[@]}" \
              || { echo "::error::$s — findings in the renders"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      # The declared floor (copier.yml _min_copier_version; DESIGN.md D2). The renders above
      # take the newest Copier; these four profiles (each variant as a fresh copy makes it, and
      # business-all-on, which ships .github/) are rendered again on exactly the floor, and must
      # be the newest's renders byte for byte: only .git (the record of the run) and the answers
      # file's _commit and _src_path (each run renders its own snapshot) may differ.
      - name: Prove the declared Copier floor
        if: always()
        run: |
          floor="$(grep -m1 -E '^_min_copier_version:' copier.yml | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          [ -n "$floor" ] || { echo "::error::copier.yml declares no _min_copier_version"; exit 1; }
          echo "the declared floor: Copier $floor"
          only=theology-defaults,fiction-defaults,business-defaults,business-all-on
          COPIER_CMD="uvx copier==$floor" bash .github/scripts/generate-all.sh "$RUNNER_TEMP/floor" --only "$only" > /dev/null \
            || { echo "::error::generate-all — a render fails on Copier $floor, the declared floor"; exit 1; }
          answers=.copier-answers.syntek-author.yml
          status=0
          for n in $(printf '%s' "$only" | tr ',' ' '); do
            if [ ! -d "$RUNNER_TEMP/renders/$n" ]; then
              echo "::error::$n — no render on the newest Copier to compare the floor with"; status=1; continue
            fi
            diff -rq --no-dereference --exclude=.git --exclude="$answers" "$RUNNER_TEMP/renders/$n" "$RUNNER_TEMP/floor/$n" \
              || { echo "::error::$n renders differently on Copier $floor, the declared floor"; status=1; }
            diff <(grep -vE '^(_commit|_src_path):' "$RUNNER_TEMP/renders/$n/$answers") \
                 <(grep -vE '^(_commit|_src_path):' "$RUNNER_TEMP/floor/$n/$answers") \
              || { echo "::error::$n records other answers on Copier $floor, the declared floor"; status=1; }
          done
          exit $status

  lifecycle:
    name: "[3/3] Update, adoption, coexistence"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Each test renders its own scratch project from a snapshot of this checkout, acts as an
      # author (or as a second template), and asserts what an update or an adoption left behind.
      - name: Prove each test, then run it
        run: |
          uvx copier --version
          command -v sqlite3 && sqlite3 --version || echo "sqlite3: not installed"
          status=0
          for s in update-test adopt-test coexist-test; do
            echo "::group::$s"
            bash ".github/scripts/$s.sh" --self-test \
              || { echo "::error::$s — the self-test no longer separates good input from bad"; status=1; }
            bash ".github/scripts/$s.sh" \
              || { echo "::error::$s — an ownership promise was broken"; status=1; }
            echo "::endgroup::"
          done
          exit $status
