# glyphs.toml — the Example Tongue script
#
# One [[glyph]] per letter, read by tooling/script.py (transliterate, render, check) and
# tooling/font.py (build, assign, check). The script is an alphabet: one letter per sound, each
# a run of the stem with a number of cuts above, below or across it. The rules in words, and
# what is not yet designed, are in transliteration.md and script.md.
#
# Every SVG is one filled outline (fill="currentColor"), drawn on the em grid below: viewBox
# 0 0 <advance> 1000, y growing downwards, the baseline at y = 800. The stem runs edge to edge,
# so the letters of a word join into one unbroken line, as the stem of a carved post would.
# Code points are left unpinned: the shared assignment gives U+E000 onwards in file order, and
# `uv run tooling/font.py assign example-tongue` prints the lines that would pin them.

[meta]
type = "alphabet"            # alphabet | abjad | abugida | syllabary | logographic | featural
direction = "ltr"            # ltr | rtl | ttb
units_per_em = 1000
ascender = 800
descender = -200
default_advance = 600

[meta.inspiration]           # independent of the sound model (language.toml)
medium = "wood"              # stone | wood | clay | palm-leaf | parchment | paper | metal | other
tool = "knife"               # chisel | knife | stylus | reed-pen | brush | quill | other
origin = "native"            # native | borrowed:<from> | adapted:<from>
script_family = "Ogham"
period = "fourth to sixth centuries AD (the orthodox inscriptions)"
borrows = ["structure", "stroke-style"]   # never the glyphs themselves
sources = ["research/src/setting/example-model-ogham.md"]

[[glyph]]
id = "o"
romanisation = "o"
ipa = "o"
name = "one notch"
description = "One notch across the stem: the commonest vowel takes the fewest cuts."
strokes = ["stem, left to right", "one notch across the stem"]
svg = "glyphs/o.svg"
advance = 220
forms = { final = "glyphs/o-final.svg" }
codepoint = ""

