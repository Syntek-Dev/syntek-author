[[inspiration]]
language = "Classical Latin"
period = "classical"
family = "Italic (Indo-European)"
weight = "primary"
borrows = ["phonology", "phonotactics"]
sources = ["research/src/setting/example-model-classical-latin.md"]
notes = "Taken: five vowel qualities, kʷ as one sound, and stop-plus-liquid clusters that open a syllable. Not taken: vowel length, the weight-sensitive stress (stress here is simply penultimate), and any Latin word or affix."
