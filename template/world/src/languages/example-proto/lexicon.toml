# lexicon.toml — Example Proto
#
# One [[word]] per entry, appended in the order coined; never reorder. Roots and affixes are
# entries too (pos = "root" or "affix"). Every key is present in every entry, even when empty;
# proto_form and entered_after stay empty here, because a proto-language has no parent.
# Checked by `make lexicon`; the fields are explained in world/docs/reference/lexicon-format.md.
# Every form here is reconstructed: in prose about the language's history it takes an asterisk
# (*fepom), and no speaker in the book says it.

