# defaults.yaml — Pandoc defaults for <%PROJECT_NAME%>, shared by every Pandoc build.
#
# Run builds through make (make pdf, make docx…), never pandoc by hand: the Makefile
# chooses the files, excludes governance files and drafts, adds the LaTeX header for
# PDF builds only, and refreshes the references first where they are on.
#
# The title and author below come from the answers given when the project was
# generated. They live here and in .claude/CLAUDE.md Section 1, nowhere else.

from: markdown

<: if INCLUDE_REFERENCES -:>
# Citations -------------------------------------------------------------------
citeproc: true
bibliography:
  - build/references.json     # generated by: make refs
csl: tooling/harvard.csl      # Harvard (Cite Them Right)
<: if DOC_TYPE == 'theology' -:>
# The default Bible translation is in every reference list, though no sentence cites it.
# make refs writes build/nocite.yaml (nocite: '@<%BIBLE_TRANSLATION%>'); it is a metadata file
# because Pandoc reads a citation there, and never in the metadata below. The translation is
# listed once its key is in tooling/references.db (the add-reference skill); until then Pandoc
# leaves it out without a word, so check the reference list in every proof.
metadata-files:
  - build/nocite.yaml         # generated by: make refs
<: endif :>
<: endif -:>
# PDF engine ------------------------------------------------------------------
# XeLaTeX: proper footnotes and system fonts, including non-Latin scripts.
pdf-engine: xelatex

variables:<: if DOC_TYPE != 'business' :>
  documentclass: book
  papersize: a4
  fontsize: 11pt
  geometry:
    - margin=1in<: endif :><: if DOC_TYPE == 'business' :>
  documentclass: article
  papersize: a4
  fontsize: 11pt
  geometry:
    - margin=20mm<: endif :>
  linkcolor: black
  # To use a specific installed typeface, uncomment and set:
  # mainfont: "Name Of An Installed Font"

metadata:<: if DOC_TYPE != 'business' :>
  title: "<%WORKING_TITLE%>"<: if SUBTITLE :>
  subtitle: "<%SUBTITLE%>"<: endif :>
  author: "<%AUTHOR_NAME%>"<: endif :><: if DOC_TYPE == 'business' :>
  author: "<%TRADING_NAME%>"<: endif :>
  lang: en-GB<: if INCLUDE_REFERENCES :>
  link-citations: true    # hyperlink in-text citations to the reference list<: endif :>
