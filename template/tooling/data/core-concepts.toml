# core-concepts.toml — the core vocabulary every constructed language is measured against
#
# Read by `python3 tooling/lexicon.py coverage` (make coverage). A lexicon entry fills a
# concept when its `concept` field names the concept's key; one word may fill several, and a
# concept may be filled by a phrase-word the grammar builds. The list was written for this
# template from everyday need in a story (who, where, what people do, what things are like),
# not copied from any published word list, and its glosses say which sense is meant.
#
# Coverage is a progress measure, not a gate: a language for a novel needs the words its
# speakers would actually use on the page, and a missing concept is a prompt, never an error.
# Template-owned: `copier update` may refine it. Add the book's own core words to the lexicon,
# not here.
#
# Fields: key (kebab-case, unique; what `concept` cites) · gloss (the sense meant) ·
# domain (for grouping the report) · pos (the part of speech most languages use for it).
#
# The pronoun grid follows the concepts. A cell with `requires` is expected only when the
# language's language.toml `marks` lists every value it names (dual, clusivity, formality,
# animacy, gender); a cell with `unless` is not expected when `marks` lists any of them.

