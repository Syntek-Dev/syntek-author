% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# Which service keeps a copy of the data root. The values are stable; the labels may change.
# The answer runs nothing: the owner sets up and runs the service, and the data-root tool
# tailors its advice and checks to the answer. It is asked always and never refused: a
# difference from the other template's answer moves no file, so the tool reports it instead.
#
# The default keeps a recorded answer. Failing that, it maps a retired yes-or-no answer about
# Google Drive workflows that an older record may hold (true becomes google-drive, false
# none), so the update that first asks this keeps what the project had; then it takes the
# other template's recorded answer; and otherwise none. This project's own record, current or
# retired, outranks the other template's.
DATA_PROVIDER:
  type: str
  help: >-
    Which service keeps a copy of this project's data root, the folder outside the repository
    that holds its documents, images, audio and video? You set that service up and run it
    yourself: the template never syncs, uploads or deletes anything there, and only tailors
    the checks and advice of its data-root tool. Point the service at the data root, never at
    this repository: a sync service corrupts a Git repository. While the files are kept in the
    repository, the answer applies once you move them out. Where this template ships GitHub
    workflows for your provider, they need the files kept in the repository; choosing another
    provider, or keeping the files outside, later deletes them, including your edits.
  choices:
    "None — the data root stays on this machine only (back it up yourself)": none
    "Google Drive — Drive for desktop, or rclone on Linux": google-drive
    "OneDrive or SharePoint — the OneDrive sync app": onedrive
    "Dropbox — the Dropbox app": dropbox
    "Another cloud service — synced by a tool you run, such as rclone": other-cloud
    "A NAS or server on your network — SMB or NFS, on the LAN or over WireGuard": nas
  default: "<% (_external_data.prev or {}).get('DATA_PROVIDER') if (_external_data.prev or {}).get('DATA_PROVIDER') in ['none', 'google-drive', 'onedrive', 'dropbox', 'other-cloud', 'nas'] else ('google-drive' if (_external_data.prev or {}).get('INCLUDE_DRIVE_SYNC') is sameas true else ('none' if (_external_data.prev or {}).get('INCLUDE_DRIVE_SYNC') is sameas false else ((_external_data.peer or {}).get('DATA_PROVIDER') if (_external_data.peer or {}).get('DATA_PROVIDER') in ['none', 'google-drive', 'onedrive', 'dropbox', 'other-cloud', 'nas'] else 'none'))) %>"
# END family-shared questions (D48)

TIMEZONE:
  type: str
  help: Your timezone, as an IANA name — skills use it for dates in filenames and headers
  default: Europe/London
  validator: >-
    <: if '/' not in TIMEZONE and TIMEZONE != 'UTC' :>
    Use an IANA timezone name, for example Europe/London.
    <: endif :>

# ── Meta ─────────────────────────────────────────────────────────────────────

DATE:
  type: str
  help: >-
    Baseline date stamped into every metadata header (DD/MM/YYYY, day first). It is answered
    once and kept, so `copier update` never churns every header in the project.
  placeholder: 03/10/2026
  validator: >-
    <: if DATE | length != 10 or DATE[2] != '/' or DATE[5] != '/'
       or (DATE[0:2] ~ DATE[3:5] ~ DATE[6:10]) | reject('in', '0123456789') | list | length > 0 :>
    Use DD/MM/YYYY, for example 03/10/2026.
    <: elif (DATE[0:2] | int) < 1 or (DATE[0:2] | int) > 31 or (DATE[3:5] | int) < 1 or (DATE[3:5] | int) > 12 :>
    Use DD/MM/YYYY — day first, then month (01–12).
    <: elif (DATE[0:2] | int) > [31, 29 if (DATE[6:10] | int) % 4 == 0 and ((DATE[6:10] | int) % 100 != 0
       or (DATE[6:10] | int) % 400 == 0) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][(DATE[3:5] | int) - 1] :>
    That month has no such day: use a date the calendar has, for example 03/10/2026.
    <: endif :>

# ── Computed (never asked, never stored) ─────────────────────────────────────
#
# `when: false` hides a question and keeps it out of the answers file, so these are
# recomputed from DOC_TYPE on every copy and update and can never drift from it (verified in
# the probe, 03/10/2026). They exist so the spine files can name the content layer and the
# unit without a conditional at every mention. Like every variant token they may appear only
# in the spine set (DESIGN.md Section 2, token discipline); a shared file says "the content
# layer" and routes to .claude/rules/syntek-author/01-layout-and-routing.md instead.

CONTENT_LAYER:
  type: str
  default: "<% 'library' if DOC_TYPE == 'business' else 'manuscript' %>"
  when: false

UNIT_NOUN:
  type: str
  default: "<% 'document' if DOC_TYPE == 'business' else 'chapter' %>"
  when: false

# ── Migrations ───────────────────────────────────────────────────────────────
#
# Run on `copier update` only, never on `copier copy`, when the update crosses the declared
# version. They exist for the one thing Copier's merge cannot do on its own: move files the
# AUTHOR wrote. Copier only tracks what it generated, so a renamed folder takes its
# governance pair to the new path and leaves every draft, unit brief and ledger entry behind
# — with no conflict and no error.
#
# The rule from the first release: folder names and workflow numbers are frozen and
# append-only (DESIGN.md D26), and any release that renames or moves a folder that can hold
# author work ships a version-keyed migration IN THE SAME COMMIT, or it silently strands that
# work (D44).
#
# Seeds are the second case. .claude/settings.json, .gitignore and the rest of DESIGN.md
# Section 3.1 are never re-rendered once they exist (D17), so a release that changes what a
# seed must contain ships that change as a migration too.
#
# House shape for a migration script: it lives in migrations/ at this repository's root
# (outside template/, so it never ships) and is read from the template clone through
# _copier_conf.src_path. It is idempotent; it never overwrites and never deletes; it acts only
# where exactly one destination or value is correct and reports everything else with file and
# line; it guards on the folders' CONTEXT.md markers, so a folder Copier has not retired (or a
# destination it has not delivered) is never touched; and it always exits 0, because a
# non-zero exit aborts every migration declared after it and leaves the project half-upgraded.
# Key it to the release the folder MOVED in, never the release somebody noticed. Migrations
# run in declaration order, so a later release's entry goes ABOVE this one only if it must run
# first; otherwise append.
#
# ONE STATED EXCEPTION (DESIGN.md D44, D48): the family-shared pair between the markers below,
# migrations/agents-outside-link.py, carries no `version:` because it must run on every update,
# is a Python script named without a release, and removes one file, its own held link, where
# the update already put an identical .agents link back. Copier checks that no destination
# resolves outside the project BEFORE it reads _exclude (9.17.1, _main.py:810-812), so an
# .agents link to a folder outside the project fails every update; hold renames that link to
# .agents.syntek-held before the render (after Copier's dirty check) and prints the hand fix
# first (check what stands at .agents, and stop where nothing is held; remove a link Copier
# put back alone, never rm -r, or move a folder or a file aside; then move the held link
# back), and restore, declared before every other after-stage entry, renames it back. The
# link's target is never touched, and both stages always exit 0. The pair stays at the TOP of
# the list. No migration runs on `copier copy`: the copy recipe is in the bridge,
# .claude/syntek-author-agents.md, and in README.md. update-test.sh checks 40–43 and the
# script's own --self-test prove it.
#
# A `version:` entry runs only when the update crosses that version, which Copier reads from
# the template's git tags (PEP 440): an update to an untagged HEAD that is still numbered
# 0.1.x does not run it. An entry with no `version:` runs on every update (Copier 9.17.1,
# _template.py:429-456). update-test.sh tags its snapshot with VERSION to prove the real path.
#
# The lines strictly between the D48 markers below are FAMILY-SHARED: every template of the
# family carries them byte for byte, so they name no template and no decision number, and
# family-shared.sh hashes them.
_migrations:
# BEGIN family-shared migrations (D48)
  # Unversioned on purpose, so they run on every update and never on a copy. Where .agents
  # is a link that resolves outside the project, which Copier refuses to render beneath even
  # where _exclude names it, hold renames the link to .agents.syntek-held before the render
  # and restore renames it back after; the link's target is never touched. Both always exit
  # 0. Keep this pair first: restore must run before every other after-stage migration.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/agents-outside-link.py" hold'
    when: "<% _stage == 'before' %>"
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/agents-outside-link.py" restore'
    when: "<% _stage == 'after' %>"
# END family-shared migrations (D48)
  # v0.2.0 retires v0.1.0's six business family folders for the D39 families. Copier removes
  # the governance files it generated in the old folders and leaves everything an author
  # created there, in folders nothing routes to any more. This moves those files to their D44
  # destination (proposals → business, contracts → legal, policies → business, or msp-scp when
  # it is chosen, correspondence → email, finance → accounting, marketing → social-media), only
  # into a family the update delivered and only where the destination is free, and lists what
  # it left, the old signposts the update deleted (edits included) and every file that still
  # cites an old path. Business projects only: the script also checks DOC_TYPE itself, so a
  # hand run in a book is a no-op.
  - version: v0.2.0
    command: bash "<% _copier_conf.src_path %>/migrations/v0.2.0-business-families.sh"
    when: "<% _stage == 'after' and DOC_TYPE == 'business' %>"
  # v0.2.0 also moved every project value the skills read into the new seed
  # .claude/rules/syntek-author/00-project.md, which they now read from `## Brief` alone (D40).
  # The update writes that seed from the answers, but v0.1.0 told the author to keep the brief
  # current in .claude/CLAUDE.md Section 1 (and the reader test in MEMORY.md, the trading name in
  # disclaimers.md, the currency, jurisdiction and translation in the style sheet), all seeds
  # the update never rewrites, so an edited value would silently revert to the answer. This
  # copies a value into `## Brief` only where the bullet still reads the answer and the sources
  # hold exactly one other value, and never over an answer given during the update itself (it
  # differs from the answer recorded before v0.2.0, read from git history), where the older
  # value is listed as a conflict. It lists every other difference with file:line, and every
  # seed line that still gives v0.1.0's guidance. Every variant: no DOC_TYPE test (D44).
  - version: v0.2.0
    command: bash "<% _copier_conf.src_path %>/migrations/v0.2.0-project-settings.sh"
    when: "<% _stage == 'after' %>"
  # v0.5.0 adds the data root (DESIGN.md D50) and replaces INCLUDE_DRIVE_SYNC with
  # DATA_PROVIDER (D53), and moves nothing: the update records DATA_STORE repo where no
  # sibling template records a store, so binaries stay tracked, and an ignore rule never
  # untracks a file. This reports, in every variant and on every run alike: the recorded store
  # and the sibling's; the binaries tracked in each layer that files them; under repo, an
  # author's own file at a data-root ignore path, which would conflict on opting in; whether
  # the seed settings.json wires the data-root guard (an update never wires it: D17); the
  # next command under external; every Drive workflow the answers no longer ship, which keeps
  # running unmanaged; and every seed line that still names INCLUDE_DRIVE_SYNC or counts the
  # rules as 01- to 08-. Report only (D44): idempotent, never writes, always exits 0. No
  # DOC_TYPE test: the script reads the answers itself.
  - version: v0.5.0
    command: bash "<% _copier_conf.src_path %>/migrations/v0.5.0-data-root.sh"
    when: "<% _stage == 'after' %>"
  # The update report (DESIGN.md D52) and the shared-file refresh (D51), unversioned and LAST,
  # so it runs after every other migration on every update and sees what they left. The
  # lines strictly between its markers are family-shared like the block above, and
  # family-shared.sh checks they close _migrations. Its copy-time twin is the last _tasks entry.
# BEGIN family-shared update (D48)
  # Unversioned and last, so it runs after every other migration on every update. It reports
  # each file this update did not deliver, refreshes the shared files the owner had not
  # changed, and records the render in refs/<template>/ inside .git. Always exits 0.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/family-update.py" update --src "<% _copier_conf.src_path %>" --to <% _copier_conf.vcs_ref_hash %> --answers "<% _copier_conf.answers_file %>"'
    when: "<% _stage == 'after' %>"
# END family-shared update (D48)

# ── After a copy (DESIGN.md D50) ─────────────────────────────────────────────
#
# Printed once, after a fresh copy (and an adoption) has written the project, and only under
# the external store: what each machine needs before anything is filed. The root is never a
# Copier answer, so this is the one place a copy can say where it comes from. A copy under
# repo prints nothing here. An update renders its copies quietly, so this never prints there.
_message_after_copy: |-
  <: if DATA_STORE == 'external' :>
  This project keeps its binary files outside the repository, under each machine's data root
  (DATA_STORE external), in <% DATA_AREA %>/<kind folder>/<% DATA_SLUG %>/ below the root.
  On each machine you work on, once:
    1. Choose the data root, a folder outside every repository, and set the environment
       variable SYNTEK_DATA_ROOT to its absolute path (in your shell profile, or in the
       system's environment settings on Windows).
    2. Create the empty marker file .syntek-data-root at the top of that folder: nothing is
       filed under a folder without it, which also catches a disk that is not mounted.
    3. Run make root here: it checks the root, and prints where each kind of file goes and
       the checklist for the service you chose to keep a copy of it.
  Text work (drafting, proofs, lint) needs none of this; issuing and filing a copy do.
  <:- endif :>

# ── Before an update ─────────────────────────────────────────────────────────
#
# DESIGN.md D35. Printed on every `copier update`, BEFORE the questions are asked — which is
# also why it cannot be tailored to the project: Copier renders it before any answer, the
# previous ones included, is loaded (checked in the 9.18.2 source, 03/10/2026). So it names
# what each option-off deletes in every variant, and the author reads the lines for theirs.
# update-test.sh check 12 proves it is printed; a quiet run (--quiet) suppresses it.
_message_before_update: |

  Before you answer: turning an option off deletes EVERY file it generated, including the
  seeds you have filled in (git history keeps the last committed copy). Copy out and commit
  anything you need first. Your own files are never deleted, except in one case. In a
  repository adopted additively, a file of yours at an unticked family's or option's template
  path (its skill, its folder pairs) is deleted with it: copy it out first.

    INCLUDE_PROPOSAL=false           proposal/: theology book-proposal/01-08,
                                     endorsements/tracker.md; fiction query-letter.md,
                                     synopsis-short.md, synopsis-long.md, comp-titles.md,
                                     submissions/tracker.md; both sample/sample-index.md,
                                     and the proposal/docs/project/ and
                                     proposal/workflows/local/ index files
    INCLUDE_WORLDBUILDING=false      creatures, cultures, peoples, history (with
                                     world/src/history/eras.md), quests, AND the whole
                                     constructed-language kit
    INCLUDE_CONLANG=false            the constructed-language kit: tooling/lexicon.py,
                                     script.py, font.py, tooling/data/, its guides, workflows
                                     and skills (your languages and their ignored audio stay)
    INCLUDE_REFERENCES=false         tooling/seed-refs.sql, schema.sql, export_refs.py,
                                     harvard.csl, standards/referencing/ (references.db stays)
    INCLUDE_SENSITIVE_CONTENT=false  standards/risk/sensitive-content.md, the testimony
                                     workflow and sensitivity-pass
    DATA_PROVIDER other than         .github/, the Drive push and pull workflows (business)
    google-drive, or DATA_STORE
    external
    DATA_STORE=repo                  library/src/.gitignore, research/src/.gitignore and
                                     proposal/src/.gitignore (the data-root ignore files);
                                     files under the data root stay there, and none comes
                                     back into the repository
    BUSINESS_FAMILIES, a family      library/src/<family>/ with its signposts (the
    unticked                         CONTEXT.md and CLAUDE.md of it and its sub-folders,
                                     drafts/README.md),
                                     library/docs/reference/<family>-standards.md and its
                                     sub-documents (EMAIL-ANATOMY-AND-NAMING.md,
                                     MSP-SCP-POLICY-SUITE.md), the <family>-documents skill
                                     and the family's create workflow, including your edits
                                     to any of these files (your own documents elsewhere in
                                     the folder stay)

  DOC_TYPE never changes: the update refuses it, because a different variant is a new project.
  After any option change, edit by hand the seeds that describe your options: README.md,
  CONTEXT.md, .claude/CLAUDE.md, .claude/rules/syntek-author/00-project.md (## Brief),
  .claude/settings.json and .gitignore.

  In a repository adopted additively, a file you kept at a template path comes back with
  conflict markers whenever the template changed it: keep your version, and extend it by hand
  if you want the template's change.

  Every project, updating from v0.1.0: Brief values (audience, reader test and the variant's
  answers) are now read only from .claude/rules/syntek-author/00-project.md ## Brief; the
  migration copies a value you changed in .claude/CLAUDE.md Section 1 where that is
  unambiguous and lists the rest.

  Business, updating from v0.1.0: the families replace proposals/, contracts/, policies/,
  correspondence/, finance/ and marketing/ under library/src/. A migration moves the files
  you created there into the new families where the destination is free, and lists anything
  it left behind and every file that still names an old folder. The old folders' signposts
  are deleted even where you edited them; your lines remain in git history.

  A project created before agent clients were added records none on this update: the
  question defaults to none there, and an update never writes a client's files. Pass
  --data "AGENT_CLIENTS=[...]" (for example [codex, opencode]) to record the clients you use,
  then follow .claude/syntek-author-agents.md to add their files. Scripted updates need
  --defaults.

  Every project, updating from v0.2.0 or earlier: the ledger now records each section's
  original and every revision, with who made it, and make compare prints them. Sections
  worked before the update carry no revision record: make compare shows each with the stages
  its entry holds (an AI-drafted section from its AI original to its final, every change
  unattributed; an author-drafted one as its final alone) and says the rest were not
  recorded. Nothing is migrated: no file moves, and an older entry is never backfilled.

  Every project, updating from v0.4.0 or earlier: DATA_STORE, where the project's binary
  files are kept, is asked for the first time. With --defaults it records repo, so they stay
  in the repository as before, unless the other syntek template's answers file
  (.copier-answers.syntek-media.yml) already records a store, which this project then takes:
  a first answer that differs from it is refused. Choosing external delivers the data-root
  ignore files and moves nothing; make files-plan then lists what to copy out. Where you
  already have your own library/src/.gitignore, research/src/.gitignore or
  proposal/src/.gitignore, choosing external brings it back with conflict markers: merge your
  lines with the template's by hand.

  DATA_STORE external to repo also forgets the data-root folder answers (DATA_AREA,
  DATA_SLUG and the kinds): note them, and pass them again with --data if you return to
  external. Files already filed stay where they are; the data-root tool names their folders.

  Business, updating from v0.4.0 or earlier: INCLUDE_DRIVE_SYNC is replaced by DATA_PROVIDER,
  which every variant now asks. A recorded true becomes google-drive and keeps the Drive
  workflows; false becomes none. The workflows stay only while DATA_PROVIDER is google-drive
  and DATA_STORE is repo: any other answer deletes .github/, your edits included. A Copier
  settings file that sets DATA_PROVIDER replaces this mapping, and with --defaults can delete
  live workflows. --data INCLUDE_DRIVE_SYNC=... is now ignored.

  A Copier settings file that sets DATA_STORE replaces its default, the other template's
  answer and repo on this first update included: with --defaults every existing project
  records it, and under external a business project's Drive workflows are deleted, edits
  included. Never set DATA_STORE or DATA_SLUG there; set DATA_AREA or a kind there only where
  it equals every other template's recorded answer.

  If this update stops with OSError: [Errno 39] Directory not empty, never commit what it
  left: README.md 'Updating a project', at the template's source, gives the recovery and the
  command to use.

# ── After an update (DESIGN.md D50, D52, D53) ───────────────────────────────
#
# The update report is printed by the last _migrations entry. Copier runs no migration when it
# cannot read a version on either side (Copier 9.17.1, _template.py:396), and then nothing
# reports what the update kept back: this says so, after every update.
#
# The data-root lines follow (D50, D53). Under the external store: what each machine needs,
# and that a changed folder answer leaves filed files where they were. Then each difference
# from the sibling template's recorded answers, read through `_external_data.peer` (probed
# safe here on 9.17.1 and 9.18.2): its store, its layout while both are external, and its
# provider. A later difference is allowed and refused only by the resolver's data commands,
# so this is where the author first hears of it. Never compare with `_external_data.prev`
# here: Copier re-reads it after writing the new answers, so it holds them, not the old ones
# (9.17.1 `_main.py:1449`). Every test of DATA_STORE is an equality, one positive block per
# value (DESIGN.md Section 2). The dash that opens each block tag trims the line break before
# it, so a closed block prints no blank line.
_message_after_update: |

  If no '▸ syntek-author update report' line appears above, Copier ran no migration (it could
  not read a template version): run git status, and look for .rej files and conflict markers.
  The report again, after any update that printed it:
    git log -1 --format=%B syntek-author/template
  Its records live in .git under refs/syntek-author/: git push leaves them behind, but
  git push --mirror publishes them, and syntek-author/yours keeps your HEAD at this update
  reachable. Before rewriting history to remove a secret, delete both with git update-ref -d.
  <:- if DATA_STORE == 'external' :>

  This project keeps its binary files under each machine's data root (DATA_STORE external).
  On a machine not yet set up: set SYNTEK_DATA_ROOT to the root's absolute path, create the
  empty marker file .syntek-data-root at the top of the root, then run make root here. If
  this update changed DATA_AREA, DATA_SLUG or a kind folder, files already filed stay under
  the old folder: make files-status names it, and make files-plan lists what is still to
  copy out of the repository.
  <:- endif :>
  <:- set pe = _external_data.peer or {} :>
  <:- set ps = pe.get('DATA_STORE') :>
  <:- set pp = pe.get('DATA_PROVIDER') :>
  <:- if DATA_STORE == 'external' and ps == 'repo' :>

  The other syntek template's answers file (.copier-answers.syntek-media.yml) records
  DATA_STORE repo, and this one now external. One project keeps one store: until both
  agree, the data-root commands (make files-*) refuse to act, though text work goes on.
  Update that template with --data DATA_STORE=external, which takes this one's folder
  answers, or this one back with --data DATA_STORE=repo.
  <:- endif :>
  <:- if DATA_STORE == 'repo' and ps == 'external' :>

  The other syntek template's answers file (.copier-answers.syntek-media.yml) records
  DATA_STORE external, and this one repo. One project keeps one store: until both agree,
  the data-root commands (make files-*) refuse to act, though text work goes on. Update
  this template with --data DATA_STORE=external, which takes the other one's folder
  answers, or that one with --data DATA_STORE=repo.
  <:- endif :>
  <:- if ps and ps not in ['external', 'repo'] :>

  The other syntek template's answers file (.copier-answers.syntek-media.yml) records
  DATA_STORE '<% ps %>', which this version of syntek-author does not offer: the
  data-root commands (make files-*) refuse to act until both templates record one store.
  <:- endif :>
  <:- if DATA_STORE == 'external' and ps == 'external' and [DATA_AREA, DATA_SLUG, DATA_KIND_DOCS, DATA_KIND_PHOTOS, DATA_KIND_AUDIO, DATA_KIND_VIDEOS] != [pe.get('DATA_AREA'), pe.get('DATA_SLUG'), pe.get('DATA_KIND_DOCS'), pe.get('DATA_KIND_PHOTOS'), pe.get('DATA_KIND_AUDIO'), pe.get('DATA_KIND_VIDEOS')] :>

  The other syntek template's answers file (.copier-answers.syntek-media.yml) files this
  project under a different layout: DATA_AREA, DATA_SLUG or a kind folder differs. One
  project keeps one layout: until both agree, the data-root commands (make files-*) refuse
  to act. Update one template with --data for each key that differs.
  <:- endif :>
  <:- if pp and pp != DATA_PROVIDER :>

  The other syntek template's answers file (.copier-answers.syntek-media.yml) records
  DATA_PROVIDER '<% pp %>', and this one '<% DATA_PROVIDER %>'. One data root has one
  provider, and make root prints the checklist for this template's answer. Nothing is
  refused: answer the same in both templates.
  <:- endif :>

# ── Post-generation ──────────────────────────────────────────────────────────

_tasks:
  # ORDER MATTERS IN THIS LIST: Copier runs _tasks top to bottom, on `copy` AND on `update`.
  # A task that must not touch a live project carries an explicit
  # `when: "<% _copier_operation == 'copy' %>"`; the absence of one means it runs on every
  # update. Every task below is copy only: an update changes files only through the merge and
  # the migrations, which report what they did (D52). Every task is non-fatal by construction,
  # because a failing task aborts the whole generation — or the whole update — after the files
  # are already written.
  #
  # There are no `mv` seed tasks (cross-check Section 6.6). Seeds are _skip_if_exists, which
  # is adoption-safe; an `mv` onto an existing file clobbers it.
  #
  # 1. A repository first, because the PreCompact hook locates the project with
  #    `git rev-parse --show-toplevel`. Guarded by `[ -d .git ]` because adoption is a
  #    `copier copy` INTO an existing repository, which must never be re-initialised.
  - command: "[ -d .git ] || git init --initial-branch=main"
    when: "<% _copier_operation == 'copy' %>"

  # 2. The hooks must be executable, and a git checkout of the template does not always carry
  #    the bit. Copy only (DESIGN.md D51): the hooks are copy-only shared files, so an update
  #    never renders them and must not change their mode either; migrations/family-update.py
  #    sets the recorded mode (755) on a hook it writes or refreshes, and leaves every other
  #    file's mode alone. It never fails, so a copy into a project without hooks completes.
  - command: "chmod +x .claude/hooks/*.sh 2>/dev/null || true"
    when: "<% _copier_operation == 'copy' %>"

  # 3. Build the references database from schema.sql and seed-refs.sql, on copy only and only
  #    where the pipeline ships. `make init` already refuses to replace an existing database;
  #    the `[ ! -f ]` guard says so before make is even asked. Non-fatal: without sqlite3 or
  #    make the project is still complete, and the message says what to run later.
  - command: >-
      command -v sqlite3 >/dev/null 2>&1 && command -v make >/dev/null 2>&1 &&
      [ ! -f tooling/references.db ] && make init
      || echo 'References database not built here (it needs sqlite3 and make, and never replaces an existing tooling/references.db) — run `make init` when ready.'
    when: "<% _copier_operation == 'copy' and INCLUDE_REFERENCES %>"

  # 4. LAST: record this project's render of the version just copied (DESIGN.md D52), so the
  #    first update reports from a recorded render instead of rendering the old version
  #    again, and refresh any shared file (D51) that equals a render recorded before (a copy
  #    over a project that already took a template). It writes refs/syntek-author/template
  #    inside .git, needs the repository task 1 made, and always exits 0. A copy with
  #    --skip-tasks (the additive adoption, D41) records nothing; the first update then
  #    renders the old version itself. Family-shared: the sibling template's task is the same.
  - command: '"<% _copier_python %>" "<% _copier_conf.src_path %>/migrations/family-update.py" baseline --src "<% _copier_conf.src_path %>" --to <% _copier_conf.vcs_ref_hash %> --answers "<% _copier_conf.answers_file %>"'
    when: "<% _copier_operation == 'copy' %>"
