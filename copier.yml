  - "<: if not (DOC_TYPE == 'business' and 'legal' in BUSINESS_FAMILIES) :>/library/docs/reference/legal-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/docs/reference/email-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'accounting' in BUSINESS_FAMILIES) :>/library/docs/reference/accounting-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'social-media' in BUSINESS_FAMILIES) :>/library/docs/reference/social-media-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/docs/reference/msp-scp-standards.md<: endif :>"
  # A standard over the line cap splits into SCREAMING-SNAKE-CASE sub-documents behind its thin
  # index (D25); each sub-document carries its standard's gate.
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/docs/reference/EMAIL-ANATOMY-AND-NAMING.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/docs/reference/MSP-SCP-POLICY-SUITE.md<: endif :>"
