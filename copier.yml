# copier.yml — the contract a new writing repository is generated from.
#
#   uvx copier copy --trust gh:Syntek-Dev/syntek-author my-book
#
# User guide: README.md. Design contract: DESIGN.md — where this file and DESIGN.md disagree,
# DESIGN.md wins and this file is the one that is wrong.

# 9.11.0 since v0.5.0 (16/10/2026; DESIGN.md D2), 9.6.0 before it, never 9.0.0. The seed-once
# example gates in _exclude and the copy-only _tasks below read `_copier_operation`, which did
# not exist until Copier 9.6.0. On anything older the expression is undefined, and it fails in
# BOTH directions at once: the copy-only tasks hold SHUT, so a fresh generation never runs
# `git init`, and the seed-once exclusions hold OPEN, so every example an author deleted comes
# back on the next update. A floor that admits a Copier which cannot read the file's own
# safety mechanism is not a floor. And `UNSET`, which the data-root slug's default renders
# where no slug can be derived (the family-shared questions block, D48, D50), did not exist
# until 9.11.0: it is absent from 9.6.0 through 9.10.3, so syntek-media raises its floor with
# the same block.
_min_copier_version: "9.11.0"

# Everything that ships lives at its real path under template/ (DESIGN.md D1). The repository
# root holds the template's OWN state — DESIGN.md, this file, VERSION, CHANGELOG.md, the
# audits in .github/scripts/ and the adoption scripts in adopt/ — and none of it is rendered.
#
# This is why there is no anchored list of root state files below, no .copier/ staging folder
# and no `mv` seed task: syntek-author is not itself a writing project, so nothing at this
# root needs keeping out of a generated one. It also keeps the business variant's Google
# Drive workflows in template/.github/ inert here; at the root they would run on every push.
_subdirectory: template

# A named answers file, not the default .copier-answers.yml (DESIGN.md D3, Section 9). A
# second template — syntek-media is the first planned — must be able to sit in the same
# repository with its own answers file, and two templates writing one answers file would
# overwrite each other's record on every update.
#
# THE COST, AND IT IS REAL: `copier update` looks for .copier-answers.yml unless it is told
# otherwise (verified in the Copier 9.18.2 source, 03/10/2026), so every update must be run
# as `copier update --trust -a .copier-answers.syntek-author.yml`. Without `-a` it stops with
# no answers to read; it never updates the wrong thing. README.md and the rendered answers
# file both say so.
_answers_file: .copier-answers.syntek-author.yml

# The previous answers, read back so that DOC_TYPE's validator can refuse a change of variant
# on update (DESIGN.md D35). The path is the destination's: on `copier update` it is the
# project's own record. On a fresh `copier copy`, and on adoption, the file does not exist yet:
# Copier prints a MissingFileWarning and `_external_data.prev` is empty, which the validator's
# `default(DOC_TYPE, true)` reads as "no previous answer". That warning on every copy is the
# accepted cost. Never test `_copier_operation` in a validator, default or `when:` instead: it
# is undefined there (Copier 9.17.1 `_main.py:434-458`; it exists only in _exclude, _tasks and
# _migrations). AGENT_CLIENTS reads the same record for its default (DESIGN.md D47): a recorded
# answer is kept, a record without one (a project from before D47) gives no client, and no
# record gives all four.
#
# `peer` is the sibling template's record (DESIGN.md D35, D50, D53), read in the family-shared
# questions block for the data-root answers (DATA_*) alone, and for whether it exists at all:
# a template's first data-root answers default to the sibling's and must equal them, and a
# sibling record without DATA_STORE (from before the data root) makes this template's first
# store `repo`. It sits here, outside the block, because each template names the OTHER one's
# file. Where the sibling has never been applied, Copier prints a second MissingFileWarning,
# for this file, and `_external_data.peer` is empty: the same accepted cost, doubled. Never
# read it in a body, an _exclude gate or _message_before_update (which renders before any
# answer); the block's defaults and validators and _message_after_update may read it.
_external_data:
  prev: .copier-answers.syntek-author.yml
  peer: .copier-answers.syntek-media.yml

# Every file is a template — tokens are not confined to a suffixed subset.
_templates_suffix: ""

# One path ships as a symbolic link: `.agents/skills -> ../.claude/skills` (DESIGN.md D47),
# the skill discovery path Codex, Gemini CLI, Antigravity and OpenCode share. Preserved, it
# renders as a link to the one canonical skills tree rather than as a second copy that drifts
# from the first. The link is relative, so it survives a move or a clone. `.agents` itself is
# a real folder, never a link: a linked `.agents` makes every sandboxed Codex command fail on
# Linux, and would show Antigravity all of .claude/ rather than its skills.
_preserve_symlinks: true

# Tokens are written <%TOKEN%> rather than {{TOKEN}} so they cannot collide with anything a
# writing repository already contains: GitHub Actions expressions (${{ }}) in the business
# Drive workflows, LaTeX braces and % comments in the house preamble and book.latex, Pandoc
# template variables, or a Jinja-like {{ }} in front-matter tooling. Before settling, every
# text file of the three source repositories was scanned for <%, <: and <~ (03/10/2026):
# none occurs, so the set carries over unchanged.
_envops:
  variable_start_string: "<%"
  variable_end_string: "%>"
  block_start_string: "<:"
  block_end_string: ":>"
  comment_start_string: "<~"
  comment_end_string: "~>"
  keep_trailing_newline: true

# Patterns are gitignore-style and are matched against DESTINATION paths, relative to
# template/ (verified in a probe template, 03/10/2026). ANCHORED (leading slash) means
# template content; UNANCHORED means "never part of a checkout" and matches at any depth.
#
# With _subdirectory set, Copier's default _exclude is [] rather than its usual list, and
# defining _exclude replaces the default in any case — so the defaults are re-listed here.
# Without them, a __pycache__ left by running tooling/*.py inside template/ would ship.
_exclude:
  - .git
  - .svn
  - __pycache__
  - "*.py[co]"
  - .DS_Store
  - "~*"
  # Generated binaries. Built proofs are rebuilt by `make`, and the references database is
  # built by `make init` from schema.sql and seed-refs.sql (DESIGN.md D21) — a .db shipped
  # from here would carry this repository's rows into every project, as binary nobody can
  # review in a diff.
  - "*.pdf"
  - "*.db"
  # The Makefile's output folder, should anyone run `make` inside template/. ANCHORED, never
  # bare: an unanchored `build` would also swallow .claude/skills/build/, the proof skill
  # every variant needs.
  - /build
  #
  # ── Gated paths ──────────────────────────────────────────────────────────────
  #
  # A templated _exclude entry is the SINGLE conditionalisation mechanism for paths, as in
  # syntek-base. When a gate is shut the path is never rendered at all, so a Jinja error inside
  # a fiction-only file cannot break a theology generation; when it is open the entry renders
  # to an empty string, which Copier ignores. One line per path, never a multi-pattern block.
  #
  # EVERY LINE READS  "<: if not (GATE) :>/path<: endif :>"  where GATE is the "ships when"
  # expression of DESIGN.md Section 3.5, copied verbatim. The index files (a CONTEXT.md or
  # CLAUDE.md whose folder holds gated children) wrap the same path's row in
  # "<: if GATE :>…<: endif :>" with the SAME string — so an audit can pair every exclusion
  # with every index row mechanically, and a gate that drifts in one place shows up as a
  # mismatch rather than as a dangling citation in one variant. The one exception is the
  # generated mode-file block at the end, whose lines read "<: if DOC_TYPE != 'x' :>…" as
  # gen-mode-excludes.sh writes them; the audits negate both forms.
  #
  # Every gate carries its DOC_TYPE test (DESIGN.md Section 2). A question hidden by `when:`
  # still has its default in the render context, so a gate written as a bare
  # `INCLUDE_CONLANG` would open in a theology project the day that default changed.
  #
  # Bare paths name whole directories. That is safe only because nothing under a gated
  # directory is negated back in; a future allowlist inside one needs `/**` and quoted
  # `"!…"` negations instead.
  #
  # ── Content layers and option layers (DESIGN.md Section 3.5) ──
  - "<: if not (DOC_TYPE != 'business') :>/manuscript<: endif :>"
  - "<: if not (DOC_TYPE == 'business') :>/library<: endif :>"
  - "<: if not (DOC_TYPE != 'business' and INCLUDE_PROPOSAL) :>/proposal<: endif :>"
  - "<: if not (DOC_TYPE == 'fiction') :>/world<: endif :>"
  # The printed book (D31): a production layer for books only. Business deliverables are
  # already LaTeX documents in library/, so they have nothing to typeset.
  - "<: if not (DOC_TYPE != 'business') :>/typeset<: endif :>"
  # A CI workflow travels with what it runs: the Drive push and pull workflows are the whole
  # of template/.github/, and they are meaningless without a business library to sync. They
  # ship only for DATA_PROVIDER google-drive with DATA_STORE repo (DESIGN.md D37, D53): a
  # GitHub runner has no data root, so under the external store the push would find nothing
  # to issue and bin the Drive copy of every file the move untracks. Another provider, or the
  # external store, deletes them on update, the author's edits included (D35).
  #
  # `(KEY | default(…))` on purpose (DESIGN.md Section 3.5): `.github/` is a path v0.4.0 and
  # earlier shipped, and during `copier update` Copier renders the OLD version with THIS
  # _exclude against the OLD answers (9.17.1 `_main.py:1390-1393`, 9.18.2 `:1417-1420`), which
  # hold neither question. A bare test is false there, so `.github/` would drop out of the
  # merge base: every changed or edited workflow would come back with conflict markers, and a
  # gate closing in that update would leave the files on disk, unmanaged. Each default is the
  # value under which the old release shipped the path; the old release's own gate still keeps
  # `.github/` out of the base where it never shipped. In a new render the defaults are inert,
  # but they are part of the verbatim gate string, here and in every index row.
  - "<: if not (DOC_TYPE == 'business' and (DATA_PROVIDER | default('google-drive')) == 'google-drive' and (DATA_STORE | default('repo')) == 'repo') :>/.github<: endif :>"
  #
  # ── The data root (DESIGN.md D50, Section 3.5): the three data-root ignore files ──
  #
  # Template-owned, token-free and identical in every variant that ships them; each ships only
  # under DATA_STORE external, so binary records and issued copies in its layer stay out of
  # Git and are filed under the machine's data root instead. An ignore rule never untracks a
  # file: binaries already tracked stay tracked until the author moves them. Each gate tests
  # DATA_STORE by equality with a value, never by `!=`, `not in`, a bare test or an `else`
  # arm (DESIGN.md Section 2), so a store value a later release adds opens none of them. The
  # paths are new in v0.5.0 and absent from every old render, so they need no `| default(…)`
  # term. DATA_STORE is never hidden, so research/src/ needs no DOC_TYPE test; the other two
  # carry their layer's. Leaving `external` on update deletes them (_message_before_update).
  - "<: if not (DOC_TYPE == 'business' and DATA_STORE == 'external') :>/library/src/.gitignore<: endif :>"
  - "<: if not (DATA_STORE == 'external') :>/research/src/.gitignore<: endif :>"
  - "<: if not (DOC_TYPE != 'business' and INCLUDE_PROPOSAL and DATA_STORE == 'external') :>/proposal/src/.gitignore<: endif :>"
  #
  # ── manuscript/ (books): variant guides and workflows (DESIGN.md Section 4.4) ──
  - "<: if not (DOC_TYPE == 'theology') :>/manuscript/docs/reference/main-text-and-footnotes.md<: endif :>"
  - "<: if not (DOC_TYPE == 'fiction') :>/manuscript/docs/reference/scene-craft.md<: endif :>"
  - "<: if not (DOC_TYPE == 'theology') :>/manuscript/workflows/10-steelman-the-objections<: endif :>"
  #
  # ── library/ (business, gated above): the document families (DESIGN.md D39, Section 3.5) ──
  #
  # A family is four things that travel together: its folder in library/src/, its standard in
  # library/docs/reference/, its <family>-documents skill (in the skills block below) and its
  # create workflow (Section 4.4, 11–15). `business` is always chosen — BUSINESS_FAMILIES'
  # validator refuses a list without it — so its folder, standard and workflow 10 carry no line
  # of their own: library/ itself is their gate. Each line reads BUSINESS_FAMILIES even though
  # library/ is already shut outside business, because a hidden question keeps its default in
  # the render context and every gate carries its DOC_TYPE test (DESIGN.md Section 2).
  #
  # These replace v0.1.0's six family folders (proposals, contracts, policies, correspondence,
  # finance, marketing), which shipped to every business project with no gate at all. The
  # v0.2.0 migration below moves what an author kept in them (D44).
  - "<: if not (DOC_TYPE == 'business' and 'legal' in BUSINESS_FAMILIES) :>/library/src/legal<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/src/email<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'accounting' in BUSINESS_FAMILIES) :>/library/src/accounting<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'social-media' in BUSINESS_FAMILIES) :>/library/src/social-media<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/src/msp-scp<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'legal' in BUSINESS_FAMILIES) :>/library/docs/reference/legal-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/docs/reference/email-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'accounting' in BUSINESS_FAMILIES) :>/library/docs/reference/accounting-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'social-media' in BUSINESS_FAMILIES) :>/library/docs/reference/social-media-standards.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/docs/reference/msp-scp-standards.md<: endif :>"
  # A standard over the line cap splits into SCREAMING-SNAKE-CASE sub-documents behind its thin
  # index (D25); each sub-document carries its standard's gate.
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/docs/reference/EMAIL-ANATOMY-AND-NAMING.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/docs/reference/MSP-SCP-POLICY-SUITE.md<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'legal' in BUSINESS_FAMILIES) :>/library/workflows/11-create-a-legal-document<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'email' in BUSINESS_FAMILIES) :>/library/workflows/12-write-an-email<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'accounting' in BUSINESS_FAMILIES) :>/library/workflows/13-create-an-accounting-document<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'social-media' in BUSINESS_FAMILIES) :>/library/workflows/14-create-a-social-media-document<: endif :>"
  - "<: if not (DOC_TYPE == 'business' and 'msp-scp' in BUSINESS_FAMILIES) :>/library/workflows/15-create-an-msp-scp-document<: endif :>"
  #
  # ── planning/ (all variants): variant sources, guides and workflows ──
  - "<: if not (DOC_TYPE == 'theology') :>/planning/src/arguments<: endif :>"
  - "<: if not (DOC_TYPE == 'fiction') :>/planning/src/causality.md<: endif :>"
  - "<: if not (DOC_TYPE == 'fiction') :>/planning/src/timeline.md<: endif :>"
