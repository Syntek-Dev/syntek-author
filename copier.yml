  - /research/docs/project/CLAUDE.md
  - /research/workflows/local/CONTEXT.md
  - /research/workflows/local/CLAUDE.md
  - /proposal/docs/project/CONTEXT.md
  - /proposal/docs/project/CLAUDE.md
  - /proposal/workflows/local/CONTEXT.md
  - /proposal/workflows/local/CLAUDE.md
  - /world/docs/project/CONTEXT.md
  - /world/docs/project/CLAUDE.md
  - /world/workflows/local/CONTEXT.md
  - /world/workflows/local/CLAUDE.md
  - /typeset/docs/project/CONTEXT.md
  - /typeset/docs/project/CLAUDE.md
  - /typeset/workflows/local/CONTEXT.md
  - /typeset/workflows/local/CLAUDE.md

# ── Identity ─────────────────────────────────────────────────────────────────

PROJECT_NAME:
  type: str
  help: >-
    The project's name as a human would write it: a book's working title, or a plain name
    such as 'Client Documents' for a business library.
  placeholder: The Salt Ferry
  validator: >-
    <: if not PROJECT_NAME | trim :>
    Give the project a name — every metadata header reads it.
    <: endif :>
    <: if '"' in PROJECT_NAME or '\\' in PROJECT_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string, and the house style uses
    single quotation marks anyway.
    <: endif :>

# The default keeps only letters, digits, spaces and hyphens and joins the words with
# hyphens, so a title with a colon or an apostrophe ('The Ferryman's Daughter: A Novel')
# still yields a valid slug instead of a default the validator rejects.
#
# The validator is DESIGN.md's ^[a-z][a-z0-9-]+$ written as character-set tests, because
# Jinja has no regular expressions without an extension and this template loads none.
PROJECT_SLUG:
  type: str
  help: >-
    The project's machine name in kebab-case. It heads the project memory file and names
    anything that needs a file-safe name.
  default: "<% (PROJECT_NAME | lower | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 -') | join).split() | join('-') %>"
  validator: >-
    <: if PROJECT_SLUG | length < 2 or PROJECT_SLUG[0] not in 'abcdefghijklmnopqrstuvwxyz'
       or PROJECT_SLUG | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>
    Use kebab-case that starts with a letter: lower-case letters, digits and hyphens only,
    at least two characters (the pattern ^[a-z][a-z0-9-]+$).
    <: endif :>

# ── Variant ──────────────────────────────────────────────────────────────────
#
# The one answer that decides the shape of the tree: which content layer ships (manuscript/
# or library/), which variant skills, workflows and guides ship, and which single mode file
# sits beside every shared skill. Asked second, so every later question's help, default and
# choices can speak to the variant.
#
# NO DEFAULT, ON PURPOSE. `copier copy --defaults` without it stops with 'Question "DOC_TYPE"
# is required' rather than quietly generating a theology book, so CI, the audits and every
# adoption must say which variant they mean.
#
# Changing it later is REFUSED (DESIGN.md D35). The content layer holds author work, and
# `copier update` only moves what it generated: a project that switched variant would keep its
# chapters in a folder nothing routes to, and lose every variant seed it had filled in. The
# validator compares the answer with the previous one, read from the project's answers file
# through _external_data; on a copy there is no previous answer and it always passes. Proven
# on 9.18.2: a changed DOC_TYPE stops the update before a single file is touched
# (update-test.sh checks 10 and 11). A different variant is a new project.
DOC_TYPE:
  type: str
  help: >-
    What are you writing? 'theology' — a Christian non-fiction book; 'fiction' — a novel,
    with optional worldbuilding and constructed languages; 'business' — business, legal and
    client documents. This cannot be changed later: an update refuses a different answer.
  choices:
    - theology
    - fiction
    - business
  validator: >-
    <: if (_external_data.prev.DOC_TYPE | default(DOC_TYPE, true)) != DOC_TYPE :>
    DOC_TYPE cannot change on update. This project was generated as
    '<% _external_data.prev.DOC_TYPE %>', and its content layer holds your work, which a
    different variant would strand. A different variant is a new project: generate one and
    copy your work across.
    <: endif :>

# ── The brief and the author ─────────────────────────────────────────────────

# The first question about the WORK rather than its labels. It renders into
# .claude/CLAUDE.md Section 1 and the README, and every skill reads it before anything else —
# so a vague answer here is a vague answer echoed through every planning step downstream.
# Title and brief live only there and in the answers (route, do not restate).
PROJECT_DESCRIPTION:
  type: str
  help: >-
    <: if DOC_TYPE == 'theology' :>The book's thesis<: elif DOC_TYPE == 'fiction' :>The
    novel's premise<: else :>What the library is for<: endif :>, in one or two full
    sentences. Every skill reads this brief before anything else — write it as a brief, not a
    tagline.
  placeholder: >-
    <: if DOC_TYPE == 'theology' :>Why the shared table matters for a small congregation,
    argued from the meal scenes in Luke's Gospel for readers with no theological
    training.<: elif DOC_TYPE == 'fiction' :>A ferry pilot on a drowned coast must carry a
    stranger across the salt marsh before the spring tide, and learns that the crossing is
    all that keeps the old border shut.<: else :>The contracts, policies, proposals and client
    correspondence of a two-person design studio, kept as one consistent, versioned
    library.<: endif :>
  validator: >-
    <: if PROJECT_DESCRIPTION | trim | length < 40 :>
    Write at least a full sentence — a tagline is not a brief, and this is what every skill
    reads before it reads anything else.
    <: endif :>

# The author's name in its exact printed form. It renders into every metadata header and the
# build metadata, so its FORM is load-bearing: 'J. R. Example' and 'J R Example' are
# different strings to every search, every index and every publisher's system.
AUTHOR_NAME:
  type: str
  help: >-
    Your name exactly as it is printed on the cover or the document, full stops included
    (for a business library, the person or firm that signs). Settle its form now and never
    change it later.
  placeholder: Robin Example
  validator: >-
    <: if not AUTHOR_NAME | trim :>
    Give the name as it is printed — every metadata header carries it.
    <: endif :>
    <: if '"' in AUTHOR_NAME or '\\' in AUTHOR_NAME :>
    Avoid double quotation marks and backslashes — this value is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

# How skills address the author in chat. Derived from the first word of AUTHOR_NAME, which is
# wrong whenever the printed name opens with an initial or a title — hence a question rather
# than a computed value.
AUTHOR_FIRST_NAME:
  type: str
  help: >-
    What should the skills call you in chat? Defaults to the first word of your name; change
    it if that is an initial or a title.
  default: "<% (AUTHOR_NAME.split() or [''])[0] %>"
  validator: >-
    <: if not AUTHOR_FIRST_NAME | trim :>
    Give the name the skills should use when they speak to you.
    <: endif :>

# ── The reader ───────────────────────────────────────────────────────────────
#
# Both answers drive the `comprehension` skill, which reads every unit as this reader. The
# choices depend on DOC_TYPE (Copier renders a templated `choices:` string as YAML), so a
# novel is never offered a board of directors as its audience.

AUDIENCE:
  type: str
  help: >-
    Who reads it? The comprehension skill reads every <: if DOC_TYPE == 'business'
    :>document<: else :>chapter<: endif :> as this reader.
  choices: |
    <:- if DOC_TYPE == 'theology' :>
    - lay
    - ministry-leaders
    - academic
    <:- elif DOC_TYPE == 'fiction' :>
    - middle-grade
    - young-adult
    - adult
    <:- else :>
    - client
    - staff
    - board
    - public
    <:- endif :>
  default: "<% {'theology': 'lay', 'fiction': 'adult', 'business': 'client'}[DOC_TYPE] %>"

READER_TEST:
  type: str
  help: >-
    One sentence naming the reader every page must work for — the lowest common denominator,
    for example 'a church leader reading on a Tuesday evening'.
  default: "<% {'theology': 'a church member with no theological training, reading at the end of a working day', 'fiction': 'a reader who has never met these characters and decides by the end of chapter one whether to go on', 'business': 'a busy client reading on a phone between meetings, who must know what to do next'}[DOC_TYPE] %>"
  validator: >-
    <: if READER_TEST | trim | length < 20 :>
    Name a real reader in a real moment — a sentence, not a label.
    <: endif :>

# ── Books (theology and fiction) ─────────────────────────────────────────────

WORKING_TITLE:
  type: str
  help: The book's working title, as the proof's title page should print it
  default: "<% PROJECT_NAME %>"
  when: "<% DOC_TYPE != 'business' %>"
  validator: >-
    <: if '"' in WORKING_TITLE or '\\' in WORKING_TITLE :>
    Avoid double quotation marks and backslashes — the title is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

SUBTITLE:
  type: str
  help: The book's subtitle, or leave it blank
  default: ""
  when: "<% DOC_TYPE != 'business' %>"
  validator: >-
    <: if '"' in SUBTITLE or '\\' in SUBTITLE :>
    Avoid double quotation marks and backslashes — the subtitle is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

# ── Theology ─────────────────────────────────────────────────────────────────

# A citation key, not a translation's name: scripture is cited through the references
# pipeline like any other source, and keys are lower-case and never renamed (D21).
BIBLE_TRANSLATION:
  type: str
  help: >-
    The citation key of the Bible translation you quote by default, lower-case as it appears
    in the references database, for example niv2011.
  default: niv2011
  when: "<% DOC_TYPE == 'theology' %>"
  validator: >-
    <: if not BIBLE_TRANSLATION or BIBLE_TRANSLATION | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789') | list | length > 0 :>
    Use a citation key: lower-case letters and digits only, for example niv2011.
    <: endif :>

# ── Fiction ──────────────────────────────────────────────────────────────────
#
# Every novel gets world/ (characters, places, the names register), character arcs and
# naming (D16). The two kits below add to it, and the conlang kit is only offered on top of
# the worldbuilding one, because a language with no culture to speak it has nothing to name.

FICTION_GENRE:
  type: str
  help: The novel's genre — it sets the default for the worldbuilding kit
  choices:
    - fantasy
    - science-fiction
    - historical
    - literary
    - crime
    - romance
    - other
  default: fantasy
  when: "<% DOC_TYPE == 'fiction' %>"

INCLUDE_WORLDBUILDING:
  type: bool
  help: >-
    Add the worldbuilding kit: creatures, cultures and quests, with their workflows and
    skills. Characters, places and the names register ship with every novel regardless.
    Turning this off later deletes every file it generated, including seeds you have filled
    in, and the constructed-language kit with it.
  default: "<% DOC_TYPE == 'fiction' and FICTION_GENRE in ['fantasy', 'science-fiction'] %>"
  when: "<% DOC_TYPE == 'fiction' %>"

# The default repeats the DOC_TYPE test even though the question is only asked for fiction:
# a hidden question keeps its default in the render context, and that default must never be
# true outside a novel.
INCLUDE_CONLANG:
  type: bool
  help: >-
    Add the constructed-language kit: phonology, grammar, lexicon, etymology, a writing
    system and pronunciation. Audio needs an ElevenLabs MCP server added at user scope (see
    the syntek-author README); it is never added to the project's .mcp.json. Turning this off
    later deletes every file it generated, including your edits to them; the languages you
    built yourself stay.
  default: "<% DOC_TYPE == 'fiction' and INCLUDE_WORLDBUILDING %>"
  when: "<% DOC_TYPE == 'fiction' and INCLUDE_WORLDBUILDING %>"

# ── Business ─────────────────────────────────────────────────────────────────

TRADING_NAME:
  type: str
  help: The name the business trades under, as its documents print it
  default: "<% PROJECT_NAME %>"
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if not TRADING_NAME | trim :>
    Give the trading name — the brand and disclaimer files carry it.
    <: endif :>
    <: if '"' in TRADING_NAME or '\\' in TRADING_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into the build
    metadata as a double-quoted string.
    <: endif :>

# Named in every legal instrument; the obligation-check and fact-check skills read it when a
# statute or a term needs its jurisdiction stated.
JURISDICTION:
  type: str
  help: The legal jurisdiction your contracts and policies are written under
  default: England and Wales
  when: "<% DOC_TYPE == 'business' %>"

CURRENCY:
  type: str
  help: The currency symbol your prices and fees are written in
  default: "£"
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if not CURRENCY | trim :>
    Give a currency symbol, for example £.
    <: endif :>

# The fix for a real drift in the source library, where some documents said 'I' and others
# 'we' for the same sole trader. One answer, held by the tone skill across every document.
BUSINESS_VOICE_PERSON:
  type: str
  help: >-
    Does the business speak as 'I' (singular — a sole trader) or as 'we' (plural — a firm)?
    The tone skill holds every document to this.
  choices:
    - singular
    - plural
  default: singular
  when: "<% DOC_TYPE == 'business' %>"

# The document families (DESIGN.md D39). Each chosen family ships its folder in library/src/,
# its standard, its <family>-documents skill and its create workflow; each family left out
# ships none of them, so a library that never sends an invoice is never offered an
# accounting skill that would fire on description match.
#
# `business` is the core — proposals, statements of work and client guides, and the home of a
# client's facts (library/src/business/client-docs/<client-slug>/) — so the validator refuses
# a list without it. `msp-scp` is opt-in: it serves only managed-service providers.
#
# The default is a YAML list (Copier stores a multiselect answer as one), and a hidden question
# keeps it in the render context, which is why every family gate also tests DOC_TYPE.
# Unticking a family on update deletes its template files like an INCLUDE_* option turned off
# (_message_before_update says so): the folder's signposts, its standard and the standard's
# sub-documents (EMAIL-ANATOMY-AND-NAMING.md, MSP-SCP-POLICY-SUITE.md), its skill and its
# workflow, the author's edits to any of them included. No family folder ships a seed. The
# author's own documents elsewhere in the folder stay, except in a repository adopted
# additively, where a file of its own at one of those template paths (its skill, its folder
# pairs) is deleted with them.
BUSINESS_FAMILIES:
  type: str
  multiselect: true
  help: >-
    Which kinds of document does the library hold? Each family adds its folder in
    library/src/, its standard, its skill and its create workflow. 'business' is always
    included; 'msp-scp' is only for managed-service providers. Unticking a family later
    deletes its folder's signposts, library/docs/reference/<family>-standards.md and its
    sub-documents (EMAIL-ANATOMY-AND-NAMING.md, MSP-SCP-POLICY-SUITE.md), its skill and its
    workflow, including your edits to any of these files; your own documents elsewhere in its
    folder stay. In a repository adopted additively, a file of yours at the family's template
    path (its skill, its folder pairs) is deleted with it: copy it out first.
  choices:
    "business — proposals, statements of work, client guides (always)": business
    "legal — contracts, NDAs, data processing agreements, terms": legal
    "email — client and supplier correspondence": email
    "accounting — invoices, expenses, financial reports": accounting
    "social-media — plans, content calendars, profiles": social-media
    "msp-scp — IT policies, plans and reports for managed-service clients": msp-scp
  default:
    - business
    - legal
    - email
    - accounting
    - social-media
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if 'business' not in BUSINESS_FAMILIES :>
    Keep 'business' ticked: it holds proposals, statements of work, client guides and each
    client's facts, and every other family routes to it.
    <: endif :>

# v0.4.0 and earlier asked here whether to ship the Drive push and pull workflows
# (INCLUDE_DRIVE_SYNC, business only, default false). v0.5.0 retires it for DATA_PROVIDER,
# asked in every variant at the end of the family-shared block below (DESIGN.md D53): its
# default maps a recorded true to google-drive and false to none, so the update that first
# asks it keeps what the project had, and Copier drops the retired key from the record (it
# remembers only keys that are still questions). A scripted `--data INCLUDE_DRIVE_SYNC=…` is
# accepted and ignored.

# ── Options ──────────────────────────────────────────────────────────────────
#
# Each option gates a layer, a standard, its workflows and its skills together. Turning one
# off later with `copier update --data …=false` deletes EVERY file that option generated,
# seeds included, even ones the author has filled in — they survive only in git history —
# and leaves every file the author created (verified in the probe, 03/10/2026; a filled
# proposal stub deleted by INCLUDE_PROPOSAL=false reproduced in the wave 3 review). Nothing
# refuses it (DESIGN.md D35 guards DOC_TYPE only): _message_before_update names what each
# option-off removes, each help below says so, and the generated README tells the author to
# copy those files out first. Seeds that describe the options (README.md, CONTEXT.md,
# .claude/CLAUDE.md, .claude/settings.json, .gitignore) are never re-rendered, so after a
# toggle the author edits them by hand.

# Defaults TRUE, unlike the other options: the layer exists in both source book
# repositories, and a book that will be sold needs a proposal or a query package.
INCLUDE_PROPOSAL:
  type: bool
  help: >-
    Add the proposal/ layer: <: if DOC_TYPE == 'theology' :>the book proposal and
    endorsements<: else :>the query package and the submissions tracker<: endif :>, with the
    approach-a-reader skill. Turning this off later deletes every file it generated,
    including seeds you have filled in.
  default: true
  when: "<% DOC_TYPE != 'business' %>"

# Asked in every variant, because a novel with real-world research or a policy citing
# guidance can want citations too; on by default only where the method depends on them.
INCLUDE_REFERENCES:
  type: bool
  help: >-
    Add the citation pipeline: a SQLite references database built by `make init`, exported
    to CSL-JSON and rendered by Pandoc in Harvard style, with the add-reference skill. Needs
    sqlite3 and pandoc. Turning this off later deletes every file it generated, including
    seeds you have filled in; the database itself is yours and stays.
  default: "<% DOC_TYPE == 'theology' %>"

INCLUDE_SENSITIVE_CONTENT:
  type: bool
  help: >-
    Add the sensitive-content standard, the sensitivity-pass skill and the safe-handling
    workflow for testimony — first-person accounts from real people. Turning this off later
    deletes every file it generated, including your edits to them.
  default: false
  when: "<% DOC_TYPE != 'business' %>"

# Copy-only, through the seed-once block of _exclude: an example the author deletes stays
# deleted. Adoption passes false (DESIGN.md Section 8).
SEED_EXAMPLES:
  type: bool
  help: >-
    Include one worked example to learn from (an example <: if DOC_TYPE == 'business'
    :>proposal<: else :>chapter<: endif :> and its brief<: if DOC_TYPE == 'fiction' :>; with
    the constructed-language kit, a tiny example language<: endif :>). Delete it when you are
    done and it never comes back. Answer false when adopting an existing repository.
  default: true

# ── Policy and locale ────────────────────────────────────────────────────────

# The tier for mechanical work only — renames, checklist ticks, builds. Substantive writing
# is always Opus and Haiku is never used (.claude/rules/syntek-author/05-model-allocation.md).
# Business defaults to Opus because a mis-ticked obligation in a contract costs more than the
# model saving.
MODEL_MECHANICAL:
  type: str
  help: >-
    Which model does mechanical work — renames, ticks and builds? Substantive writing always
    uses Opus, and Haiku is never used.
  choices:
    - sonnet
    - opus
  default: "<% 'opus' if DOC_TYPE == 'business' else 'sonnet' %>"

# ── Coding agents and the data root (DESIGN.md D47, D48, D50, D53) ──────────
#
# Claude Code always ships: .claude/ is the one tree every client reads. The first seven
# answers choose the OTHER clients and the model each one uses for substantive work (D47).
# The clients' files are copy-only (DESIGN.md Section 3.6), so a later change of answer
# re-renders the model table in .claude/rules/syntek-author/05-model-allocation.md, never the
# client's own file. The next seven place the project's binary files: in the repository, or
# under each machine's data root, and with what layout there (D50). The last says which
# service keeps a copy of that root (D53); it ships nothing but the business Drive workflows.
#
# The fifteen questions between the markers below are FAMILY-SHARED (DESIGN.md D48): every
# template of the family carries this block byte for byte, so it names no template, no
# template-only path and no decision number, and family-shared.sh hashes the lines strictly
# between the markers. Change it here first, then in every sibling template, in one release.
# Inside the block a delimiter reads only the block's own fifteen keys, `_external_data`,
# `_folder_name` (the slug's default) and Copier's `UNSET` (the same default, where no slug
# can be derived; hence the 9.11.0 floor above). The one name besides them is the retired
# INCLUDE_DRIVE_SYNC, read by DATA_PROVIDER's default inside two string literals (D48, D53).
# The peer record those defaults read is named above, under _external_data, outside the
# block, because each template names the other one's file. A question after the END marker
# can read these answers in its default and validator; one placed before the block reads ''
# under --defaults (probed on 9.17.1 and 9.18.2), so nothing outside reads them before it.
#
# Every validator below opens with its question's own `when:` test, and every gate and
# content block that reads one of these answers repeats that test (DESIGN.md Section 2).
# Copier 9.17.1 gives a hidden question its default, a settings default or a --data value,
# and validates and renders that value without recording it; without the test, a stray
# OPENCODE_CONTEXT=999 fails a Codex-only copy. Copier still checks `choices` and `type` on a
# hidden value before any validator runs, so a shared key keeps identical choices in every
# template of the family. The data-root answers add a second reason: under DATA_STORE repo
# the slug is hidden and defaults from the folder name, which differs between the two
# temporary renders of every update, so a body that printed it without its test would
# conflict on every update and put a false 'changed' line in the update report (D52).
# Every gate, `when:` and content block that tests DATA_STORE does so by equality with a
# value, one positive block per value, never `!=`, `not in`, a bare test or an `else` or
# `elif` arm (D50), so a store a later release adds (`lfs`) opens no path written for another.
# BEGIN family-shared questions (D48)
# The client values are the gate strings and never change; the labels may. Gemini CLI and
# Antigravity are two choices, not one: they share GEMINI.md and the .agents/skills link, but
# only Gemini CLI reads .gemini/settings.json and only Antigravity reads
# .agents/mcp_config.json.
#
# The default reads the previous answers record. A record that already holds this answer
# keeps it (only its values that are still choices), so a copy over an existing project
# (re-adoption) never resets the clients, unless a Copier settings file sets them. A
# record without it belongs to a project being updated, and the update that first asks this
# question must record no client whose files the project never received, so the default
# there is none. A fresh copy, with no record, gets all four. `_copier_operation` cannot make
# this test: it is undefined in question defaults.
AGENT_CLIENTS:
  type: str
  multiselect: true
  help: >-
    Which coding agents besides Claude Code will you use here? Each adds its entrypoint and
    settings; all of them read the same rules, skills and memory in .claude/. These files
    are written once: an update never adds, changes or recreates them. On an update that
    first asks this, the default is none: tick a client to add its row to the model table,
    then follow the agents bridge in .claude/ (the .claude/syntek-*-agents.md file) to add
    its files. Tick none to keep the project Claude-only.
  choices:
    "Codex — OpenAI's coding agent (AGENTS.md, .codex/)": codex
    "Gemini CLI — Google's terminal agent (GEMINI.md, .gemini/)": gemini-cli
    "Antigravity — Google's agent IDE (GEMINI.md, .agents/mcp_config.json)": antigravity
    "OpenCode 2 or later — any model, including a local server (AGENTS.md, opencode.json)": opencode
  default: "<% (_external_data.prev.AGENT_CLIENTS | select('in', ['codex', 'gemini-cli', 'antigravity', 'opencode']) | list | tojson) if (_external_data.prev.get('AGENT_CLIENTS') is sequence and _external_data.prev.get('AGENT_CLIENTS') is not string) else ('[]' if _external_data.prev.get('_commit') else '[codex, gemini-cli, antigravity, opencode]') %>"

# Blank leaves the client's own default. Codex ignores `model_provider`, `model_providers` and
# `profile(s)` in a project file, with a warning (0.160.1), so running Codex on a local model
# is the owner's user-level setting, not this answer. Model names are checked as character
# sets (no Jinja regular expressions), so an answer can never break the TOML or JSON it is
# written into.
CODEX_MODEL:
  type: str
  help: >-
    Which model should Codex use for substantive work? Leave blank to use Codex's own
    default. Written to .codex/config.toml once; change it there later.
  default: ""
  when: "<% 'codex' in AGENT_CLIENTS %>"
  validator: >-
    <: if 'codex' in AGENT_CLIENTS and CODEX_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>
    Use a model name: letters, digits and . _ : / @ + - only, no spaces or quotation marks.
    <: endif :>

GEMINI_MODEL:
  type: str
  help: >-
    Which model should Gemini CLI use for substantive work? Leave blank to use its own
    default. Written to .gemini/settings.json once; change it there later.
  default: ""
  when: "<% 'gemini-cli' in AGENT_CLIENTS %>"
  validator: >-
    <: if 'gemini-cli' in AGENT_CLIENTS and GEMINI_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>
    Use a model name: letters, digits and . _ : / @ + - only, no spaces or quotation marks.
    <: endif :>

# OpenCode is the client for local models. `user` writes no model and no provider, so each
# person's own OpenCode settings apply; `named` writes a `provider/model` only. Every local
# server is written as one OpenAI-compatible provider in opencode.json, under the server's own
# id, so the model reads `<provider>/<model>` in OpenCode. No key is written: a server that
# needs one gets it from OpenCode's own credential store or an environment variable the owner
# sets. A committed provider replaces, for every collaborator, the address of any provider of
# theirs with the same id, which is why the default writes none.
OPENCODE_PROVIDER:
  type: str
  help: >-
    Where does OpenCode get its model? A local server keeps the writing on this machine. A
    local provider written here overrides, for every collaborator, any provider of theirs
    with the same id.
  choices:
    "Use my OpenCode settings (no model or provider written)": user
    "A model I name (provider/model)": named
    "llama.cpp — llama-server or llama-swap": llama-cpp
    "Ollama": ollama
    "vLLM": vllm
    "LM Studio": lmstudio
    "Another OpenAI-compatible server": openai-compatible
  default: user
  when: "<% 'opencode' in AGENT_CLIENTS %>"

# The defaults are each server's documented local port. The validator matches
# ^https?://[^\s"]+/v1/?$ exactly, without a regular expression (fuzzed against re.fullmatch
# over 200,023 strings, Unicode whitespace included): the answer is written inside a JSON
# string, so whitespace or a quotation mark would break opencode.json. A trailing slash is
# accepted and dropped when the address is written.
OPENCODE_BASE_URL:
  type: str
  help: >-
    The server's OpenAI-compatible address, ending /v1. The default is the server's usual
    local port.
  default: >-
    <% {'llama-cpp': 'http://127.0.0.1:8080/v1', 'ollama': 'http://127.0.0.1:11434/v1',
    'vllm': 'http://127.0.0.1:8000/v1', 'lmstudio': 'http://127.0.0.1:1234/v1'}.get(OPENCODE_PROVIDER, '') %>
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] :><: set u = OPENCODE_BASE_URL :><: set body = u[8:] if u.startswith('https://') else (u[7:] if u.startswith('http://') else '') :><: set body = body[:-1] if body.endswith('/v1/') else body :><: if not body.endswith('/v1') or (body[:-3] | length) < 1 or (u.split() | join) != u or '"' in u :>Use the server's address with http:// or https:// and ending /v1 or /v1/, for example http://127.0.0.1:8080/v1.<: endif :><: endif :>

# No default model: one machine's catalogue is no project's honest default, so a local server
# needs the owner to name its model, and the validator says so.
OPENCODE_MODEL:
  type: str
  help: >-
    The model's ID. For a local server, the name it lists at /v1/models (Ollama, for example,
    qwen3:30b). For a model you name, provider/model as OpenCode lists it.
  default: ""
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER != 'user' %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER != 'user' :><: if not OPENCODE_MODEL :>Name the model: a local server's ID as it lists it at /v1/models, or provider/model.<: elif OPENCODE_MODEL | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._:/@+-') | list | length > 0 :>Use a model ID: letters, digits and . _ : / @ + - only, no spaces or quotation marks.<: elif OPENCODE_PROVIDER == 'named' and '/' not in OPENCODE_MODEL :>Write a model you name as provider/model, as OpenCode lists it.<: endif :><: endif :>

# Never larger than the server loads: OpenCode plans its context from this number, and a
# figure above the server's makes long sessions fail rather than shrink. The defaults are a
# safe floor per server, not a recommendation: 4096 is small for agent work.
OPENCODE_CONTEXT:
  type: int
  help: >-
    The context length the server actually loads for this model, in tokens. Never more than
    the server's setting: raise the server's own setting and this number together. Ollama's
    default depends on the GPU's memory (4k, 32k or 256k) unless OLLAMA_CONTEXT_LENGTH or a
    model's num_ctx sets it.
  default: "<% {'llama-cpp': 262144, 'ollama': 4096, 'lmstudio': 4096, 'vllm': 32768}.get(OPENCODE_PROVIDER, 32768) %>"
  when: "<% 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] %>"
  validator: >-
    <: if 'opencode' in AGENT_CLIENTS and OPENCODE_PROVIDER not in ['user', 'named'] and (OPENCODE_CONTEXT | int < 1024 or OPENCODE_CONTEXT | int > 10000000) :>Use the server's context length in tokens, from 1024 to 10000000.<: endif :>

# The data-root questions. Portable and path-free: each machine names its root in the
# SYNTEK_DATA_ROOT environment variable, never in a file here, and the project's resolver
# (.claude/syntek-*-dataroot.py) reads these answers at run time. The defaults read this
# template's previous answers, then the sibling template's (data-root keys only), then
# whether the project already exists (a previous record, or a sibling's record from before
# the data root). Only a value offered here is ever taken from a record, and every gate on
# the store tests it by equality, so a value a newer template adds opens nothing.
#
# So a fresh copy defaults to external, and the update that first asks this to repo, as does
# a copy beside a sibling record that predates the data root; a store the sibling already
# records comes first. The validator binds a first answer only (no store recorded here yet):
# it must equal the sibling's, so one project keeps one store. A later difference is allowed,
# reported after the update and refused by the resolver's data commands until both agree, so
# neither template can deadlock the other. A sibling value this version does not offer is
# refused with a message, never fed to `choices`. The `!=` there compares two answers, not an
# answer with a value, and opens no path.
DATA_STORE:
  type: str
  help: >-
    Where are this project's binary files kept: documents, images, audio and video (scans,
    signed copies, footage, renders, issued copies)? Outside keeps Git to text: each file is
    filed under this machine's data root, which the SYNTEK_DATA_ROOT environment variable
    names (never the repository), and is listed with its checksum. Inside keeps them in the
    repository, as before. Every template in this project uses the same answer.
  choices:
    "Outside the repository, under this machine's data root (recommended)": external
    "Inside the repository, as before": repo
  default: "<% (_external_data.prev or {}).get('DATA_STORE') if (_external_data.prev or {}).get('DATA_STORE') in ['external', 'repo'] else ((_external_data.peer or {}).get('DATA_STORE') if (_external_data.peer or {}).get('DATA_STORE') in ['external', 'repo'] else ('repo' if ((_external_data.prev or {}).get('_commit') or (_external_data.peer or {})) else 'external')) %>"
  validator: >-
    <: set p = (_external_data.peer or {}).get('DATA_STORE') :><: set q = (_external_data.prev or {}).get('DATA_STORE') :><: if p and q not in ['external', 'repo'] and DATA_STORE != p :>One project, one store: the other template recorded '<% p %>'.<: endif :>

# The layout under the root: <root>/<area>/<kind folder>/<slug>/<the file's path in the
# repository>. Asked only under the external store. Each default reads this template's
# previous answer, then the sibling's, then a literal; `business` is the area in every
# variant, because nothing in this block may read the variant. A first answer (none recorded
# here yet) must equal the sibling's exactly, case included. A later change is allowed (the
# files already filed stay under their old folder, which the resolver names), except a
# change of case alone, which one disk treats as the same folder and another as a second one.
# Leaving external forgets these answers (Copier drops a hidden answer), so a return
# re-derives them. The rules are character-set tests, without a regular expression: no
# character Windows or a network disk refuses, no control character, no trailing dot or
# space and no leading space (so neither . nor ..), no device name before the first dot in
# any case, at most 64 characters.
DATA_AREA:
  type: str
  help: >-
    The first folder under this machine's data root that holds this project's files, named
    as you want it on disk, case kept: for example business, personal or Client Work. Every
    machine and every template in this project uses the same name.
  default: "<% (_external_data.prev or {}).get('DATA_AREA') or (_external_data.peer or {}).get('DATA_AREA') or 'business' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set a = DATA_AREA :><: set p = (_external_data.peer or {}).get('DATA_AREA') :><: set q = (_external_data.prev or {}).get('DATA_AREA') :><: set stem = a.split('.')[0].rstrip(' ').upper() :><: if not a :>Name the area, the first folder under the data root: for example business.<: elif a | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif a | select('lt', ' ') | list | length > 0 or '\x7f' in a :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif a[-1] in '. ' or a[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif a | length > 64 :>Keep the name to 64 characters or fewer.<: elif q and a != q and a | lower == q | lower :>This project's files are filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and a != p and a | lower == p | lower :>The other template files this project under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and a != p :>One project, one layout: the other template files this project under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# The slug's default is the project folder's name in kebab case (lower case; `_`, `.`, `-`
# and spaces separate words; other characters dropped), cut to 64 characters with no
# trailing hyphen. Where nothing is left, or a device name, it renders UNSET, so the question
# has no default and must be answered: Copier validates a shown question's default before any
# prompt, so a default that failed this validator would abort the copy. A literal fallback
# would put every such project in one shared folder. Never renamed once files are filed.
DATA_SLUG:
  type: str
  help: >-
    This project's own folder inside each kind folder, in kebab case (a to z, 0 to 9 and
    hyphens). Every template in this project uses the same name. Never change it once files
    are filed under it: they stay in the old folder.
  default: "<: set k = ((_folder_name | lower | replace('_', ' ') | replace('.', ' ') | replace('-', ' ') | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 ') | join).split() | join('-'))[:64].rstrip('-') :><% (_external_data.prev or {}).get('DATA_SLUG') or (_external_data.peer or {}).get('DATA_SLUG') or (k if k and k not in ['con', 'prn', 'aux', 'nul', 'com1', 'com2', 'com3', 'com4', 'com5', 'com6', 'com7', 'com8', 'com9', 'lpt1', 'lpt2', 'lpt3', 'lpt4', 'lpt5', 'lpt6', 'lpt7', 'lpt8', 'lpt9'] else UNSET) %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set s = DATA_SLUG :><: set p = (_external_data.peer or {}).get('DATA_SLUG') :><: set q = (_external_data.prev or {}).get('DATA_SLUG') :><: if not s :>Name this project's folder under each kind folder, in kebab case: for example client-documents.<: elif s | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>Use lower-case letters a to z, digits and hyphens only: for example client-documents.<: elif s[0] == '-' or s[-1] == '-' or '--' in s :>Do not begin or end the name with a hyphen, or put two hyphens together.<: elif s in ['con', 'prn', 'aux', 'nul', 'com1', 'com2', 'com3', 'com4', 'com5', 'com6', 'com7', 'com8', 'com9', 'lpt1', 'lpt2', 'lpt3', 'lpt4', 'lpt5', 'lpt6', 'lpt7', 'lpt8', 'lpt9'] :>Windows reserves that name (con, prn, aux, nul, com1 to com9, lpt1 to lpt9): choose another.<: elif s | length > 64 :>Keep the name to 64 characters or fewer.<: elif not q and p and s != p :>One project, one layout: the other template files this project under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

# The four kind folders under the area. Each takes the area's rules, and each must differ
# from the kinds asked before it, ignoring case, or two kinds would share one folder on a
# case-insensitive disk.
DATA_KIND_DOCS:
  type: str
  help: >-
    The folder under the area for documents: PDFs, Office files, archives and scans.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_DOCS') or (_external_data.peer or {}).get('DATA_KIND_DOCS') or 'docs' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
    <: if DATA_STORE == 'external' :><: set k = DATA_KIND_DOCS :><: set p = (_external_data.peer or {}).get('DATA_KIND_DOCS') :><: set q = (_external_data.prev or {}).get('DATA_KIND_DOCS') :><: set stem = k.split('.')[0].rstrip(' ').upper() :><: if not k :>Name the folder for documents: for example docs.<: elif k | select('in', '<>:"/\\|?*') | list | length > 0 :>Leave out < > : " / \ | ? and *: Windows and network disks refuse them in a folder name.<: elif k | select('lt', ' ') | list | length > 0 or '\x7f' in k :>Leave out tabs and other control characters: no disk keeps them safely in a folder name.<: elif k[-1] in '. ' or k[0] == ' ' :>Do not end the name with a dot or a space, or begin it with a space: Windows drops them, which is also why . and .. are refused.<: elif stem in ['CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'] or (stem | length == 4 and stem[:3] in ['COM', 'LPT'] and stem[3] in '123456789¹²³') :>Windows reserves that name in any case, before any dot (CON, PRN, AUX, NUL, COM1 to COM9, LPT1 to LPT9 and the like): choose another.<: elif k | length > 64 :>Keep the name to 64 characters or fewer.<: elif q and k != q and k | lower == q | lower :>This project's documents are filed under '<% q %>'. A change of case alone makes a second folder on some disks and the same folder on others: keep '<% q %>', or choose another name.<: elif not q and p and k != p and k | lower == p | lower :>The other template files documents under '<% p %>'. A difference of case alone makes a second folder on some disks and the same folder on others: answer '<% p %>' exactly.<: elif not q and p and k != p :>One project, one layout: the other template files documents under '<% p %>'. Answer '<% p %>' here too, or change that template's answer first.<: endif :><: endif :>

DATA_KIND_PHOTOS:
  type: str
  help: >-
    The folder under the area for images: photographs, artwork and image exports.
  default: "<% (_external_data.prev or {}).get('DATA_KIND_PHOTOS') or (_external_data.peer or {}).get('DATA_KIND_PHOTOS') or 'photos' %>"
  when: "<% DATA_STORE == 'external' %>"
  validator: >-
