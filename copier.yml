# ── Identity ─────────────────────────────────────────────────────────────────

PROJECT_NAME:
  type: str
  help: >-
    The project's name as a human would write it: a book's working title, or a plain name
    such as 'Client Documents' for a business library.
  placeholder: The Salt Ferry
  validator: >-
    <: if not PROJECT_NAME | trim :>
    Give the project a name — every metadata header reads it.
    <: endif :>
    <: if '"' in PROJECT_NAME or '\\' in PROJECT_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string, and the house style uses
    single quotation marks anyway.
    <: endif :>

# The default keeps only letters, digits, spaces and hyphens and joins the words with
# hyphens, so a title with a colon or an apostrophe ('The Ferryman's Daughter: A Novel')
# still yields a valid slug instead of a default the validator rejects.
#
# The validator is DESIGN.md's ^[a-z][a-z0-9-]+$ written as character-set tests, because
# Jinja has no regular expressions without an extension and this template loads none.
PROJECT_SLUG:
  type: str
  help: >-
    The project's machine name in kebab-case. It heads the project memory file and names
    anything that needs a file-safe name.
  default: "<% (PROJECT_NAME | lower | select('in', 'abcdefghijklmnopqrstuvwxyz0123456789 -') | join).split() | join('-') %>"
  validator: >-
    <: if PROJECT_SLUG | length < 2 or PROJECT_SLUG[0] not in 'abcdefghijklmnopqrstuvwxyz'
       or PROJECT_SLUG | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list | length > 0 :>
    Use kebab-case that starts with a letter: lower-case letters, digits and hyphens only,
    at least two characters (the pattern ^[a-z][a-z0-9-]+$).
    <: endif :>

# ── Variant ──────────────────────────────────────────────────────────────────
#
# The one answer that decides the shape of the tree: which content layer ships (manuscript/
# or library/), which variant skills, workflows and guides ship, and which single mode file
# sits beside every shared skill. Asked second, so every later question's help, default and
# choices can speak to the variant.
#
# NO DEFAULT, ON PURPOSE. `copier copy --defaults` without it stops with 'Question "DOC_TYPE"
# is required' rather than quietly generating a theology book, so CI, the audits and every
# adoption must say which variant they mean.
#
# Changing it later is REFUSED (DESIGN.md D35). The content layer holds author work, and
# `copier update` only moves what it generated: a project that switched variant would keep its
# chapters in a folder nothing routes to, and lose every variant seed it had filled in. The
# validator compares the answer with the previous one, read from the project's answers file
# through _external_data; on a copy there is no previous answer and it always passes. Proven
# on 9.18.2: a changed DOC_TYPE stops the update before a single file is touched
# (update-test.sh checks 10 and 11). A different variant is a new project.
DOC_TYPE:
  type: str
  help: >-
    What are you writing? 'theology' — a Christian non-fiction book; 'fiction' — a novel,
    with optional worldbuilding and constructed languages; 'business' — business, legal and
    client documents. This cannot be changed later: an update refuses a different answer.
  choices:
    - theology
    - fiction
    - business
  validator: >-
    <: if (_external_data.prev.DOC_TYPE | default(DOC_TYPE, true)) != DOC_TYPE :>
    DOC_TYPE cannot change on update. This project was generated as
    '<% _external_data.prev.DOC_TYPE %>', and its content layer holds your work, which a
    different variant would strand. A different variant is a new project: generate one and
    copy your work across.
    <: endif :>

# ── The brief and the author ─────────────────────────────────────────────────

# The first question about the WORK rather than its labels. It renders into
# .claude/CLAUDE.md Section 1 and the README, and every skill reads it before anything else —
# so a vague answer here is a vague answer echoed through every planning step downstream.
# Title and brief live only there and in the answers (route, do not restate).
PROJECT_DESCRIPTION:
  type: str
  help: >-
    <: if DOC_TYPE == 'theology' :>The book's thesis<: elif DOC_TYPE == 'fiction' :>The
    novel's premise<: else :>What the library is for<: endif :>, in one or two full
    sentences. Every skill reads this brief before anything else — write it as a brief, not a
    tagline.
  placeholder: >-
    <: if DOC_TYPE == 'theology' :>Why the shared table matters for a small congregation,
    argued from the meal scenes in Luke's Gospel for readers with no theological
    training.<: elif DOC_TYPE == 'fiction' :>A ferry pilot on a drowned coast must carry a
    stranger across the salt marsh before the spring tide, and learns that the crossing is
    all that keeps the old border shut.<: else :>The contracts, policies, proposals and client
    correspondence of a two-person design studio, kept as one consistent, versioned
    library.<: endif :>
  validator: >-
    <: if PROJECT_DESCRIPTION | trim | length < 40 :>
    Write at least a full sentence — a tagline is not a brief, and this is what every skill
    reads before it reads anything else.
    <: endif :>

# The author's name in its exact printed form. It renders into every metadata header and the
# build metadata, so its FORM is load-bearing: 'J. R. Example' and 'J R Example' are
# different strings to every search, every index and every publisher's system.
AUTHOR_NAME:
  type: str
  help: >-
    Your name exactly as it is printed on the cover or the document, full stops included
    (for a business library, the person or firm that signs). Settle its form now and never
    change it later.
  placeholder: Robin Example
  validator: >-
    <: if not AUTHOR_NAME | trim :>
    Give the name as it is printed — every metadata header carries it.
    <: endif :>
    <: if '"' in AUTHOR_NAME or '\\' in AUTHOR_NAME :>
    Avoid double quotation marks and backslashes — this value is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

# How skills address the author in chat. Derived from the first word of AUTHOR_NAME, which is
# wrong whenever the printed name opens with an initial or a title — hence a question rather
# than a computed value.
AUTHOR_FIRST_NAME:
  type: str
  help: >-
    What should the skills call you in chat? Defaults to the first word of your name; change
    it if that is an initial or a title.
  default: "<% (AUTHOR_NAME.split() or [''])[0] %>"
  validator: >-
    <: if not AUTHOR_FIRST_NAME | trim :>
    Give the name the skills should use when they speak to you.
    <: endif :>

# ── The reader ───────────────────────────────────────────────────────────────
#
# Both answers drive the `comprehension` skill, which reads every unit as this reader. The
# choices depend on DOC_TYPE (Copier renders a templated `choices:` string as YAML), so a
# novel is never offered a board of directors as its audience.

AUDIENCE:
  type: str
  help: >-
    Who reads it? The comprehension skill reads every <: if DOC_TYPE == 'business'
    :>document<: else :>chapter<: endif :> as this reader.
  choices: |
    <:- if DOC_TYPE == 'theology' :>
    - lay
    - ministry-leaders
    - academic
    <:- elif DOC_TYPE == 'fiction' :>
    - middle-grade
    - young-adult
    - adult
    <:- else :>
    - client
    - staff
    - board
    - public
    <:- endif :>
  default: "<% {'theology': 'lay', 'fiction': 'adult', 'business': 'client'}[DOC_TYPE] %>"

READER_TEST:
  type: str
  help: >-
    One sentence naming the reader every page must work for — the lowest common denominator,
    for example 'a church leader reading on a Tuesday evening'.
  default: "<% {'theology': 'a church member with no theological training, reading at the end of a working day', 'fiction': 'a reader who has never met these characters and decides by the end of chapter one whether to go on', 'business': 'a busy client reading on a phone between meetings, who must know what to do next'}[DOC_TYPE] %>"
  validator: >-
    <: if READER_TEST | trim | length < 20 :>
    Name a real reader in a real moment — a sentence, not a label.
    <: endif :>

# ── Books (theology and fiction) ─────────────────────────────────────────────

WORKING_TITLE:
  type: str
  help: The book's working title, as the proof's title page should print it
  default: "<% PROJECT_NAME %>"
  when: "<% DOC_TYPE != 'business' %>"
  validator: >-
    <: if '"' in WORKING_TITLE or '\\' in WORKING_TITLE :>
    Avoid double quotation marks and backslashes — the title is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

SUBTITLE:
  type: str
  help: The book's subtitle, or leave it blank
  default: ""
  when: "<% DOC_TYPE != 'business' %>"
  validator: >-
    <: if '"' in SUBTITLE or '\\' in SUBTITLE :>
    Avoid double quotation marks and backslashes — the subtitle is written into the build
    metadata (tooling/defaults.yaml) as a double-quoted string.
    <: endif :>

# ── Theology ─────────────────────────────────────────────────────────────────

# A citation key, not a translation's name: scripture is cited through the references
# pipeline like any other source, and keys are lower-case and never renamed (D21).
BIBLE_TRANSLATION:
  type: str
  help: >-
    The citation key of the Bible translation you quote by default, lower-case as it appears
    in the references database, for example niv2011.
  default: niv2011
  when: "<% DOC_TYPE == 'theology' %>"
  validator: >-
    <: if not BIBLE_TRANSLATION or BIBLE_TRANSLATION | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789') | list | length > 0 :>
    Use a citation key: lower-case letters and digits only, for example niv2011.
    <: endif :>

# ── Fiction ──────────────────────────────────────────────────────────────────
#
# Every novel gets world/ (characters, places, the names register), character arcs and
# naming (D16). The two kits below add to it, and the conlang kit is only offered on top of
# the worldbuilding one, because a language with no culture to speak it has nothing to name.

FICTION_GENRE:
  type: str
  help: The novel's genre — it sets the default for the worldbuilding kit
  choices:
    - fantasy
    - science-fiction
    - historical
    - literary
    - crime
    - romance
    - other
  default: fantasy
  when: "<% DOC_TYPE == 'fiction' %>"

INCLUDE_WORLDBUILDING:
  type: bool
  help: >-
    Add the worldbuilding kit: creatures, cultures and quests, with their workflows and
    skills. Characters, places and the names register ship with every novel regardless.
    Turning this off later deletes every file it generated, including seeds you have filled
    in, and the constructed-language kit with it.
  default: "<% DOC_TYPE == 'fiction' and FICTION_GENRE in ['fantasy', 'science-fiction'] %>"
  when: "<% DOC_TYPE == 'fiction' %>"

# The default repeats the DOC_TYPE test even though the question is only asked for fiction:
# a hidden question keeps its default in the render context, and that default must never be
# true outside a novel.
INCLUDE_CONLANG:
  type: bool
  help: >-
    Add the constructed-language kit: phonology, grammar, lexicon, etymology, a writing
    system and pronunciation. Audio needs an ElevenLabs MCP server added at user scope (see
    the syntek-author README); nothing is added to the project's .mcp.json. Turning this off
    later deletes every file it generated, including your edits to them; the languages you
    built yourself stay.
  default: "<% DOC_TYPE == 'fiction' and INCLUDE_WORLDBUILDING %>"
  when: "<% DOC_TYPE == 'fiction' and INCLUDE_WORLDBUILDING %>"

# ── Business ─────────────────────────────────────────────────────────────────

TRADING_NAME:
  type: str
  help: The name the business trades under, as its documents print it
  default: "<% PROJECT_NAME %>"
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if not TRADING_NAME | trim :>
    Give the trading name — the brand and disclaimer files carry it.
    <: endif :>
    <: if '"' in TRADING_NAME or '\\' in TRADING_NAME :>
    Avoid double quotation marks and backslashes — this value can be written into the build
    metadata as a double-quoted string.
    <: endif :>

# Named in every legal instrument; the obligation-check and fact-check skills read it when a
# statute or a term needs its jurisdiction stated.
JURISDICTION:
  type: str
  help: The legal jurisdiction your contracts and policies are written under
  default: England and Wales
  when: "<% DOC_TYPE == 'business' %>"

CURRENCY:
  type: str
  help: The currency symbol your prices and fees are written in
  default: "£"
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if not CURRENCY | trim :>
    Give a currency symbol, for example £.
    <: endif :>

# The fix for a real drift in the source library, where some documents said 'I' and others
# 'we' for the same sole trader. One answer, held by the tone skill across every document.
BUSINESS_VOICE_PERSON:
  type: str
  help: >-
    Does the business speak as 'I' (singular — a sole trader) or as 'we' (plural — a firm)?
    The tone skill holds every document to this.
  choices:
    - singular
    - plural
  default: singular
  when: "<% DOC_TYPE == 'business' %>"

# The document families (DESIGN.md D39). Each chosen family ships its folder in library/src/,
# its standard, its <family>-documents skill and its create workflow; each family left out
# ships none of them, so a library that never sends an invoice is never offered an
# accounting skill that would fire on description match.
#
# `business` is the core — proposals, statements of work and client guides, and the home of a
# client's facts (library/src/business/client-docs/<client-slug>/) — so the validator refuses
# a list without it. `msp-scp` is opt-in: it serves only managed-service providers.
#
# The default is a YAML list (Copier stores a multiselect answer as one), and a hidden question
# keeps it in the render context, which is why every family gate also tests DOC_TYPE.
# Unticking a family on update deletes its template files like an INCLUDE_* option turned off
# (_message_before_update says so): the folder's signposts, its standard and the standard's
# sub-documents (EMAIL-ANATOMY-AND-NAMING.md, MSP-SCP-POLICY-SUITE.md), its skill and its
# workflow, the author's edits to any of them included. No family folder ships a seed. The
# author's own documents elsewhere in the folder stay, except in a repository adopted
# additively, where a file of its own at one of those template paths (its skill, its folder
# pairs) is deleted with them.
BUSINESS_FAMILIES:
  type: str
  multiselect: true
  help: >-
    Which kinds of document does the library hold? Each family adds its folder in
    library/src/, its standard, its skill and its create workflow. 'business' is always
    included; 'msp-scp' is only for managed-service providers. Unticking a family later
    deletes its folder's signposts, library/docs/reference/<family>-standards.md and its
    sub-documents (EMAIL-ANATOMY-AND-NAMING.md, MSP-SCP-POLICY-SUITE.md), its skill and its
    workflow, including your edits to any of these files; your own documents elsewhere in its
    folder stay. In a repository adopted additively, a file of yours at the family's template
    path (its skill, its folder pairs) is deleted with it: copy it out first.
  choices:
    "business — proposals, statements of work, client guides (always)": business
    "legal — contracts, NDAs, data processing agreements, terms": legal
    "email — client and supplier correspondence": email
    "accounting — invoices, expenses, financial reports": accounting
    "social-media — plans, content calendars, profiles": social-media
    "msp-scp — IT policies, plans and reports for managed-service clients": msp-scp
  default:
    - business
    - legal
    - email
    - accounting
    - social-media
  when: "<% DOC_TYPE == 'business' %>"
  validator: >-
    <: if 'business' not in BUSINESS_FAMILIES :>
    Keep 'business' ticked: it holds proposals, statements of work, client guides and each
    client's facts, and every other family routes to it.
    <: endif :>

# Ships template/.github/ — the Drive push and pull workflows — and nothing else. Off by
# default (a new optional surface defaults false): the workflows need Google credentials as
# repository secrets, and a workflow without its secrets is a red job on every push.
INCLUDE_DRIVE_SYNC:
  type: bool
  help: >-
    Add GitHub workflows that push the library to Google Drive and pull it back. They need
    Google credentials stored as repository secrets before they will run. Turning this off
    later deletes every file it generated, including your edits to them.
  default: false
  when: "<% DOC_TYPE == 'business' %>"

# ── Options ──────────────────────────────────────────────────────────────────
#
# Each option gates a layer, a standard, its workflows and its skills together. Turning one
# off later with `copier update --data …=false` deletes EVERY file that option generated,
# seeds included, even ones the author has filled in — they survive only in git history —
# and leaves every file the author created (verified in the probe, 03/10/2026; a filled
# proposal stub deleted by INCLUDE_PROPOSAL=false reproduced in the wave 3 review). Nothing
# refuses it (DESIGN.md D35 guards DOC_TYPE only): _message_before_update names what each
# option-off removes, each help below says so, and the generated README tells the author to
# copy those files out first. Seeds that describe the options (README.md, CONTEXT.md,
# .claude/CLAUDE.md, .claude/settings.json, .gitignore) are never re-rendered, so after a
# toggle the author edits them by hand.

# Defaults TRUE, unlike the other options: the layer exists in both source book
# repositories, and a book that will be sold needs a proposal or a query package.
INCLUDE_PROPOSAL:
  type: bool
  help: >-
    Add the proposal/ layer: <: if DOC_TYPE == 'theology' :>the book proposal and
    endorsements<: else :>the query package and the submissions tracker<: endif :>, with the
    approach-a-reader skill. Turning this off later deletes every file it generated,
    including seeds you have filled in.
  default: true
  when: "<% DOC_TYPE != 'business' %>"

# Asked in every variant, because a novel with real-world research or a policy citing
# guidance can want citations too; on by default only where the method depends on them.
INCLUDE_REFERENCES:
  type: bool
  help: >-
    Add the citation pipeline: a SQLite references database built by `make init`, exported
    to CSL-JSON and rendered by Pandoc in Harvard style, with the add-reference skill. Needs
    sqlite3 and pandoc. Turning this off later deletes every file it generated, including
    seeds you have filled in; the database itself is yours and stays.
  default: "<% DOC_TYPE == 'theology' %>"

INCLUDE_SENSITIVE_CONTENT:
  type: bool
  help: >-
    Add the sensitive-content standard, the sensitivity-pass skill and the safe-handling
    workflow for testimony — first-person accounts from real people. Turning this off later
    deletes every file it generated, including your edits to them.
  default: false
  when: "<% DOC_TYPE != 'business' %>"

# Copy-only, through the seed-once block of _exclude: an example the author deletes stays
# deleted. Adoption passes false (DESIGN.md Section 8).
SEED_EXAMPLES:
  type: bool
  help: >-
    Include one worked example to learn from (an example <: if DOC_TYPE == 'business'
    :>proposal<: else :>chapter<: endif :> and its brief<: if DOC_TYPE == 'fiction' :>; with
    the constructed-language kit, a tiny example language<: endif :>). Delete it when you are
    done and it never comes back. Answer false when adopting an existing repository.
  default: true

# ── Policy and locale ────────────────────────────────────────────────────────

# The tier for mechanical work only — renames, checklist ticks, builds. Substantive writing
# is always Opus and Haiku is never used (.claude/rules/syntek-author/05-model-allocation.md).
# Business defaults to Opus because a mis-ticked obligation in a contract costs more than the
# model saving.
MODEL_MECHANICAL:
  type: str
  help: >-
    Which model does mechanical work — renames, ticks and builds? Substantive writing always
    uses Opus, and Haiku is never used.
  choices:
    - sonnet
    - opus
  default: "<% 'opus' if DOC_TYPE == 'business' else 'sonnet' %>"

TIMEZONE:
  type: str
  help: Your timezone, as an IANA name — skills use it for dates in filenames and headers
  default: Europe/London
  validator: >-
    <: if '/' not in TIMEZONE and TIMEZONE != 'UTC' :>
    Use an IANA timezone name, for example Europe/London.
    <: endif :>

# ── Meta ─────────────────────────────────────────────────────────────────────

DATE:
  type: str
  help: >-
    Baseline date stamped into every metadata header (DD/MM/YYYY, day first). It is answered
    once and kept, so `copier update` never churns every header in the project.
  placeholder: 03/10/2026
  validator: >-
    <: if DATE | length != 10 or DATE[2] != '/' or DATE[5] != '/'
       or (DATE[0:2] ~ DATE[3:5] ~ DATE[6:10]) | reject('in', '0123456789') | list | length > 0 :>
    Use DD/MM/YYYY, for example 03/10/2026.
    <: elif (DATE[0:2] | int) < 1 or (DATE[0:2] | int) > 31 or (DATE[3:5] | int) < 1 or (DATE[3:5] | int) > 12 :>
    Use DD/MM/YYYY — day first, then month (01–12).
    <: elif (DATE[0:2] | int) > [31, 29 if (DATE[6:10] | int) % 4 == 0 and ((DATE[6:10] | int) % 100 != 0
       or (DATE[6:10] | int) % 400 == 0) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][(DATE[3:5] | int) - 1] :>
    That month has no such day: use a date the calendar has, for example 03/10/2026.
    <: endif :>

# ── Computed (never asked, never stored) ─────────────────────────────────────
#
# `when: false` hides a question and keeps it out of the answers file, so these are
# recomputed from DOC_TYPE on every copy and update and can never drift from it (verified in
# the probe, 03/10/2026). They exist so the spine files can name the content layer and the
# unit without a conditional at every mention. Like every variant token they may appear only
# in the spine set (DESIGN.md Section 2, token discipline); a shared file says "the content
# layer" and routes to .claude/rules/syntek-author/01-layout-and-routing.md instead.

CONTENT_LAYER:
  type: str
  default: "<% 'library' if DOC_TYPE == 'business' else 'manuscript' %>"
  when: false

UNIT_NOUN:
  type: str
  default: "<% 'document' if DOC_TYPE == 'business' else 'chapter' %>"
  when: false

# ── Migrations ───────────────────────────────────────────────────────────────
#
# Run on `copier update` only, never on `copier copy`, when the update crosses the declared
# version. They exist for the one thing Copier's merge cannot do on its own: move files the
# AUTHOR wrote. Copier only tracks what it generated, so a renamed folder takes its
# governance pair to the new path and leaves every draft, unit brief and ledger entry behind
# — with no conflict and no error.
#
# The rule from the first release: folder names and workflow numbers are frozen and
# append-only (DESIGN.md D26), and any release that renames or moves a folder that can hold
# author work ships a version-keyed migration IN THE SAME COMMIT, or it silently strands that
# work (D44).
#
# Seeds are the second case. .claude/settings.json, .gitignore and the rest of DESIGN.md
# Section 3.1 are never re-rendered once they exist (D17), so a release that changes what a
# seed must contain ships that change as a migration too.
#
# House shape for a migration script: it lives in migrations/ at this repository's root
# (outside template/, so it never ships) and is read from the template clone through
# _copier_conf.src_path. It is idempotent; it never overwrites and never deletes; it acts only
# where exactly one destination or value is correct and reports everything else with file and
# line; it guards on the folders' CONTEXT.md markers, so a folder Copier has not retired (or a
# destination it has not delivered) is never touched; and it always exits 0, because a
# non-zero exit aborts every migration declared after it and leaves the project half-upgraded.
# Key it to the release the folder MOVED in, never the release somebody noticed. Migrations
# run in declaration order, so a later release's entry goes ABOVE this one only if it must run
# first; otherwise append.
#
# A `version:` entry runs only when the update crosses that version, which Copier reads from
# the template's git tags (PEP 440): an update to an untagged HEAD that is still numbered
# 0.1.x does not run it. update-test.sh tags its snapshot with VERSION to prove the real path.
_migrations:
  # v0.2.0 retires v0.1.0's six business family folders for the D39 families. Copier removes
  # the governance files it generated in the old folders and leaves everything an author
  # created there, in folders nothing routes to any more. This moves those files to their D44
  # destination (proposals → business, contracts → legal, policies → business, or msp-scp when
  # it is chosen, correspondence → email, finance → accounting, marketing → social-media), only
  # into a family the update delivered and only where the destination is free, and lists what
  # it left, the old signposts the update deleted (edits included) and every file that still
  # cites an old path. Business projects only: the script also checks DOC_TYPE itself, so a
  # hand run in a book is a no-op.
  - version: v0.2.0
    command: bash "<% _copier_conf.src_path %>/migrations/v0.2.0-business-families.sh"
    when: "<% _stage == 'after' and DOC_TYPE == 'business' %>"
  # v0.2.0 also moved every project value the skills read into the new seed
  # .claude/rules/syntek-author/00-project.md, which they now read from `## Brief` alone (D40).
  # The update writes that seed from the answers, but v0.1.0 told the author to keep the brief
  # current in .claude/CLAUDE.md Section 1 (and the reader test in MEMORY.md, the trading name in
  # disclaimers.md, the currency, jurisdiction and translation in the style sheet), all seeds
  # the update never rewrites, so an edited value would silently revert to the answer. This
  # copies a value into `## Brief` only where the bullet still reads the answer and the sources
  # hold exactly one other value, and never over an answer given during the update itself (it
  # differs from the answer recorded before v0.2.0, read from git history), where the older
  # value is listed as a conflict. It lists every other difference with file:line, and every
  # seed line that still gives v0.1.0's guidance. Every variant: no DOC_TYPE test (D44).
  - version: v0.2.0
    command: bash "<% _copier_conf.src_path %>/migrations/v0.2.0-project-settings.sh"
    when: "<% _stage == 'after' %>"

# ── Before an update ─────────────────────────────────────────────────────────
#
# DESIGN.md D35. Printed on every `copier update`, BEFORE the questions are asked — which is
# also why it cannot be tailored to the project: Copier renders it before any answer, the
# previous ones included, is loaded (checked in the 9.18.2 source, 03/10/2026). So it names
# what each option-off deletes in every variant, and the author reads the lines for theirs.
# update-test.sh check 12 proves it is printed; a quiet run (--quiet) suppresses it.
_message_before_update: |

  Before you answer: turning an option off deletes EVERY file it generated, including the
  seeds you have filled in (git history keeps the last committed copy). Copy out and commit
  anything you need first. Your own files are never deleted, except in one case. In a
  repository adopted additively, a file of yours at an unticked family's or option's template
  path (its skill, its folder pairs) is deleted with it: copy it out first.

    INCLUDE_PROPOSAL=false           proposal/: theology book-proposal/01-08,
                                     endorsements/tracker.md; fiction query-letter.md,
                                     synopsis-short.md, synopsis-long.md, comp-titles.md,
                                     submissions/tracker.md; both sample/sample-index.md,
                                     and the proposal/docs/project/ and
                                     proposal/workflows/local/ index files
    INCLUDE_WORLDBUILDING=false      creatures, cultures, peoples, history (with
                                     world/src/history/eras.md), quests, AND the whole
                                     constructed-language kit
    INCLUDE_CONLANG=false            the constructed-language kit: tooling/lexicon.py,
                                     script.py, font.py, tooling/data/, its guides, workflows
                                     and skills (your languages and their ignored audio stay)
    INCLUDE_REFERENCES=false         tooling/seed-refs.sql, schema.sql, export_refs.py,
                                     harvard.csl, standards/referencing/ (references.db stays)
    INCLUDE_SENSITIVE_CONTENT=false  standards/risk/sensitive-content.md, the testimony
                                     workflow and sensitivity-pass
    INCLUDE_DRIVE_SYNC=false         .github/, the Drive push and pull workflows
    BUSINESS_FAMILIES, a family      library/src/<family>/ with its signposts (the
    unticked                         CONTEXT.md and CLAUDE.md of it and its sub-folders,
                                     drafts/README.md),
                                     library/docs/reference/<family>-standards.md and its
                                     sub-documents (EMAIL-ANATOMY-AND-NAMING.md,
                                     MSP-SCP-POLICY-SUITE.md), the <family>-documents skill
                                     and the family's create workflow, including your edits
                                     to any of these files (your own documents elsewhere in
                                     the folder stay)

  DOC_TYPE never changes: the update refuses it, because a different variant is a new project.
  After any option change, edit by hand the seeds that describe your options: README.md,
  CONTEXT.md, .claude/CLAUDE.md, .claude/rules/syntek-author/00-project.md (## Brief),
  .claude/settings.json and .gitignore.

  In a repository adopted additively, a file you kept at a template path comes back with
  conflict markers whenever the template changed it: keep your version, and extend it by hand
  if you want the template's change.

  Every project, updating from v0.1.0: Brief values (audience, reader test and the variant's
  answers) are now read only from .claude/rules/syntek-author/00-project.md ## Brief; the
  migration copies a value you changed in .claude/CLAUDE.md Section 1 where that is
  unambiguous and lists the rest.

  Business, updating from v0.1.0: the families replace proposals/, contracts/, policies/,
  correspondence/, finance/ and marketing/ under library/src/. A migration moves the files
  you created there into the new families where the destination is free, and lists anything
  it left behind and every file that still names an old folder. The old folders' signposts
  are deleted even where you edited them; your lines remain in git history.

  Every project, updating from v0.2.0 or earlier: the ledger now records each section's
  original and every revision, with who made it, and make compare prints them. Sections
  worked before the update carry no revision record: make compare shows each with the stages
  its entry holds (an AI-drafted section from its AI original to its final, every change
  unattributed; an author-drafted one as its final alone) and says the rest were not
  recorded. Nothing is migrated: no file moves, and an older entry is never backfilled.

# ── Post-generation ──────────────────────────────────────────────────────────

_tasks:
  # ORDER MATTERS IN THIS LIST: Copier runs _tasks top to bottom, on `copy` AND on `update`.
  # A task that must not touch a live project carries an explicit
  # `when: "<% _copier_operation == 'copy' %>"`; the absence of one means it runs on every
  # update. Both shapes are used below. Every task is non-fatal by construction, because a
  # failing task aborts the whole generation — or the whole update — after the files are
  # already written.
  #
  # There are no `mv` seed tasks (cross-check Section 6.6). Seeds are _skip_if_exists, which
  # is adoption-safe; an `mv` onto an existing file clobbers it.
  #
  # 1. A repository first, because the PreCompact hook locates the project with
  #    `git rev-parse --show-toplevel`. Guarded by `[ -d .git ]` because adoption is a
  #    `copier copy` INTO an existing repository, which must never be re-initialised.
  - command: "[ -d .git ] || git init --initial-branch=main"
    when: "<% _copier_operation == 'copy' %>"

  # 2. The hook must be executable or Claude Code cannot run it, and a git checkout of the
  #    template does not always carry the bit. Ungated and idempotent; it never fails, so an
  #    update in a project whose author removed the hook still completes.
  - command: "chmod +x .claude/hooks/*.sh 2>/dev/null || true"

  # 3. Build the references database from schema.sql and seed-refs.sql, on copy only and only
  #    where the pipeline ships. `make init` already refuses to replace an existing database;
  #    the `[ ! -f ]` guard says so before make is even asked. Non-fatal: without sqlite3 or
  #    make the project is still complete, and the message says what to run later.
  - command: >-
      command -v sqlite3 >/dev/null 2>&1 && command -v make >/dev/null 2>&1 &&
      [ ! -f tooling/references.db ] && make init
      || echo 'References database not built here (it needs sqlite3 and make, and never replaces an existing tooling/references.db) — run `make init` when ready.'
    when: "<% _copier_operation == 'copy' and INCLUDE_REFERENCES %>"
