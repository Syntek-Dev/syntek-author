  # ── The printed book (books): the author's page design and the master file ──
  - /typeset/src/page-design.md
  - /typeset/src/book.tex
  # ── References: the header only, never rows ──
  - /tooling/seed-refs.sql
  # ── Author-filled index pairs (DESIGN.md Section 3.1): wayfinder appends to the map index,
  #    and the author adds a row to each docs/project/ and workflows/local/ pair ──
  - /planning/src/maps/CONTEXT.md
  - /manuscript/docs/project/CONTEXT.md
  - /manuscript/docs/project/CLAUDE.md
