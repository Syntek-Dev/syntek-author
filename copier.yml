  # The entrypoints, the skills link and the client settings are the author's once written:
  # an update never renders them, so an edit stands and a deletion stays deleted (an author
  # who does not use Codex deletes AGENTS.md once). syntek-media's D73 makes AGENTS.md,
  # GEMINI.md, .agents, the .codex/ files and .claude/mcp_config.json copy-only in the same
  # way (its 0.4.2, D76, replaces that link and file with the .agents/ layout below); media
  # does not yet ship .gemini/ or opencode.json. Whichever template comes first writes them,
  # and neither updates them; the shared bytes are DESIGN.md D48's. Each path also has an
  # anchored line in _skip_if_exists, so a copy over an existing file skips it rather than
  # overwriting it. A changed model answer therefore reaches the table in
  # .claude/rules/syntek-author/05-model-allocation.md, not the client's file.
  #
  # .agents/ is a real folder: its two files are listed here, and the folder itself with the
  # client folders below. A copy over an existing .agents/skills LINK, of any target, skips
  # it, so a project already holding syntek-media 0.4.2's .agents/ needs no exclusion (proved
