  - "<: if DOC_TYPE != 'business' :>/standards/method/BUSINESS.md<: endif :>"
  - "<: if DOC_TYPE != 'theology' :>/standards/risk/THEOLOGY.md<: endif :>"
  - "<: if DOC_TYPE != 'fiction' :>/standards/risk/FICTION.md<: endif :>"
  - "<: if DOC_TYPE != 'business' :>/standards/risk/BUSINESS.md<: endif :>"
  - "<: if DOC_TYPE != 'theology' :>/standards/verification/THEOLOGY.md<: endif :>"
  - "<: if DOC_TYPE != 'fiction' :>/standards/verification/FICTION.md<: endif :>"
  - "<: if DOC_TYPE != 'business' :>/standards/verification/BUSINESS.md<: endif :>"
  # END generated mode excludes

# Seed-if-missing (DESIGN.md D14, D17, Section 3.1): written when absent, never overwritten
# once they exist, and recreated by the next update if the author deletes one. They are the
# files skills and rules cite by path, so they must always exist; and they are the files the
# author fills in, so the template must never write over them. A seed therefore receives no
# template improvement once it exists — which is why each ships EMPTY of entries (headings,
# writing rules and the cited-stub banner only) and why that emptiness is audited by
# `.github/scripts/shipped-seeds.sh`, not trusted.
#
# The shared root files are here for a second reason (D17): a later template such as
# syntek-media will seed the same README.md, CONTEXT.md, .claude/CLAUDE.md and settings, and
# a root file that two templates both update is a file two templates fight over.
#
# EVERY PATTERN IS ANCHORED. These are gitignore-style patterns like _exclude: an unanchored
# `CONTEXT.md` would match every governance pair in the tree and freeze all of them against
# every update, and an unanchored `.gitignore` would freeze the nested, template-owned
# .gitignore files with it.
#
# Listed UNCONDITIONALLY: a pattern for a path that does not ship in this variant is a no-op
# (verified in the probe, 03/10/2026). A variant seed therefore needs two lines in total —
# its variant gate in _exclude above, and its line here.
#
# Section 3.1 also seeds the proposal package stubs (the eight book-proposal sections and the
# four fiction package files): guides cite them by path from day one, and once drafted they
# are the author's text, which an update must never merge into. The business brand files and
# the author-filled index pairs are seeds for the same reason (Section 3.1): the author fills
# their AUTHOR TO CONFIRM slots or adds rows to their tables, and a template-owned file the
# author writes in is a merge conflict on every update.
#
# THE ONE THING A SEED DOES NOT SURVIVE is its option being turned off. `copier update` with
# an INCLUDE_* answer changed to false — or a family dropped from BUSINESS_FAMILIES — deletes
# every file that answer generated, seeds included, even ones the author has filled in
# (reproduced on 9.18.2, 03/10/2026). The _message_before_update below names them, and the
# generated README tells the author to copy them out first.
#
# A seed is listed only once its file is on disk: shipped-seeds.sh fails on a seed that is
# not. Add each line in the change that adds its file, and keep the list explicit (no globs):
# adopt/adopt.sh and the audits read it path by path.
_skip_if_exists:
  # ── The project's own settings (DESIGN.md D40, D43) ──
  # 00-project.md sits in the template-owned rules folder because Claude Code loads that folder
  # at launch, but it is the PROJECT's file: written once from the answers (brief, paths,
  # memory-heading map, workflow aliases, overrides), never overwritten, and outranking every
  # other rules file. tooling/project.mk is its build-side twin, read by the Makefile with
  # -include. Both are listed by full path: an unanchored `00-project.md` or `project.mk`
  # would match at every depth.
  - /.claude/rules/syntek-author/00-project.md
  - /tooling/project.mk
  # ── Shared root files ──
  - /README.md
  - /CONTEXT.md
  - /.gitignore
  - /.mcp.json
  - /.claude/CLAUDE.md
  - /.claude/CONTEXT.md
  - /.claude/MEMORY.md
  - /.claude/settings.json
  - /.claude/skills/CONTEXT.md
  - /.claude/skills/CLAUDE.md
  # ── Copy-only shared (DESIGN.md D47, Section 3.6): also excluded on update above ──
  - /AGENTS.md
  - /GEMINI.md
  - /.agents/skills
  - /.agents/mcp_config.json
  - /.codex/config.toml
  - /.codex/CONTEXT.md
  - /.codex/CLAUDE.md
  - /.gemini/settings.json
  - /.gemini/CONTEXT.md
  - /.gemini/CLAUDE.md
  - /opencode.json
  # ── Shared working practice (DESIGN.md D51): also excluded on update above ──
  - /.claude/skills/grill-me/SKILL.md
  - /.claude/skills/grill-with-docs/SKILL.md
  - /.claude/skills/grilling/SKILL.md
  - /.claude/skills/handoff/SKILL.md
  - /.claude/skills/to-questionnaire/SKILL.md
  - /.claude/skills/wait-what/SKILL.md
  - /.claude/skills/wayfinder/SKILL.md
  - /.claude/hooks/pre-compact-handoff.sh
  - /.claude/hooks/context-threshold-handoff.sh
  - /.claude/hooks/CONTEXT.md
  - /.claude/hooks/CLAUDE.md
  - /handoffs/CONTEXT.md
  - /handoffs/CLAUDE.md
  # ── The style trio and the provenance table ──
  - /standards/style/style-sheet.md
  - /standards/style/voice-notes.md
  - /standards/style/terminology.md
  - /standards/style/ledger/provenance.md
  # ── Planning registers ──
  - /planning/src/outline.md
  - /planning/src/causality.md
  - /planning/src/timeline.md
  - /planning/src/continuity.md
  - /planning/src/document-register.md
  - /planning/src/review-schedule.md
  - /planning/src/precedence.md
  # ── Variant registers outside planning/ ──
  - /world/src/names-register.md
  - /world/src/history/eras.md
  - /standards/brand/disclaimers.md
  - /standards/brand/brand-voice.md
  - /standards/brand/brand-guide.md
  - /research/src/permissions.md
  - /proposal/src/endorsements/tracker.md
  - /proposal/src/submissions/tracker.md
  - /proposal/src/sample/sample-index.md
  # ── Proposal package stubs (books + INCLUDE_PROPOSAL; theology then fiction) ──
  - /proposal/src/book-proposal/01-overview-and-hook.md
  - /proposal/src/book-proposal/02-why-now.md
  - /proposal/src/book-proposal/03-audience.md
  - /proposal/src/book-proposal/04-comparable-titles.md
